          @Composable
          fun StageDropdown(stages: List<Stage>, selected: String, onSelect: (String) -> Unit) {
              var expanded by remember { mutableStateOf(false) }
              val options = listOf("" to "无") + stages.filter { it.name.isNotBlank() }.map {
                  (if (it.startMin >= 0) it.key() else it.name) to (if (it.startMin >= 0) "${it.name} ${it.key()}" else it.name)
              }
              val currentLabel = options.firstOrNull { it.first == selected }?.second ?: "无"
              Box {
                  OutlinedButton(onClick = { expanded = true }, modifier = Modifier.fillMaxWidth().height(36.dp), contentPadding = PaddingValues(horizontal = 10.dp)) {
                      Text(currentLabel, Modifier.weight(1f), textAlign = TextAlign.Start, fontSize = 13.sp)
                      Text("▼", fontSize = 11.sp)
                  }
                  DropdownMenu(expanded = expanded, onDismissRequest = { expanded = false }) {
                      options.forEach { (key, label) -> DropdownMenuItem(text = { Text(label) }, onClick = { onSelect(key); expanded = false }) }
                  }
              }
          }

          fun scheduleReminder(ctx: Context, id: Int, title: String, timeMs: Long) {
              if (timeMs <= System.currentTimeMillis()) return
              try {
                  val am = ctx.getSystemService(AlarmManager::class.java) ?: return
                  val pi = PendingIntent.getBroadcast(ctx, id,
                      Intent(ctx, ReminderReceiver::class.java).apply { putExtra("id", id); putExtra("title", title) },
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                      if (am.canScheduleExactAlarms()) am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, timeMs, pi)
                      else am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, timeMs, pi)
                  } else am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, timeMs, pi)
              } catch (e: Exception) {}
          }

