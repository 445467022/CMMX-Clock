name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate project files
        run: |
          mkdir -p app/src/main/java/com/example/looptimer
          mkdir -p app/src/main/res/values

          cat > gradle.properties <<'GF_EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          GF_EOF

          cat > settings.gradle.kts <<'SG_EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "LoopTimer"
          include(":app")
          SG_EOF

          cat > build.gradle.kts <<'BG_EOF'
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          BG_EOF

          cat > app/build.gradle.kts <<'AB_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.looptimer"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.looptimer"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 11
                  versionName = "7.4"
              }
              buildTypes { release { isMinifyEnabled = false } }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.8" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation(platform("androidx.compose:compose-bom:2024.02.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-core")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
              debugImplementation("androidx.compose.ui:ui-tooling")
          }
          AB_EOF

          cat > app/src/main/AndroidManifest.xml <<'MF_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.USE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <application android:allowBackup="true" android:icon="@android:drawable/sym_def_app_icon" android:label="循环提醒" android:supportsRtl="true" android:theme="@style/Theme.LoopTimer">
                  <activity android:name=".MainActivity" android:exported="true" android:label="循环提醒">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity android:name=".RingActivity" android:exported="false"
                      android:showWhenLocked="true" android:turnScreenOn="true"
                      android:excludeFromRecents="true" android:launchMode="singleInstance" />
                  <service android:name=".TimerService" android:exported="false" android:foregroundServiceType="specialUse">
                      <property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="Interval timer" />
                  </service>
                  <receiver android:name=".ReminderReceiver" android:exported="false" />
                  <receiver android:name=".StageAlarmReceiver" android:exported="false" />
                  <receiver android:name=".ScheduleReceiver" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="looptimer.action.DAILY_START" />
                          <action android:name="looptimer.action.DAILY_STOP" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          MF_EOF

          cat > app/src/main/res/values/themes.xml <<'TH_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.LoopTimer" parent="android:Theme.Material.Light.NoActionBar" />
          </resources>
          TH_EOF

          cat > app/src/main/java/com/example/looptimer/Store.kt <<'ST_EOF'
          package com.example.looptimer

          import android.content.Context
          import org.json.JSONArray
          import org.json.JSONObject

          data class Stage(val name: String, val minutes: Int, val startMin: Int = -1) {
              fun key(): String = if (startMin >= 0) "${formatHm(startMin)}-${formatHm(startMin + minutes)}" else ""
          }

          data class Task(
              val id: Long, val title: String, val done: Boolean = false,
              val remindAt: Long = 0L, val stageKey: String = "", val note: String = "",
              val remindSound: Boolean = true,
              val remindVibrate: Boolean = true,
              val remindNotification: Boolean = true,
              val remindRingtoneType: Int = 0,
              val remindRingDuration: Int = 30
          )

          object Store {
              private const val PREF = "loop_timer"
              private fun sp(c: Context) = c.getSharedPreferences(PREF, Context.MODE_PRIVATE)

              fun loadStages(c: Context): List<Stage> {
                  val raw = sp(c).getString("stages", null) ?: return emptyList()
                  return try {
                      val a = JSONArray(raw)
                      List(a.length()) { i ->
                          val o = a.getJSONObject(i)
                          Stage(o.optString("name", "阶段"), o.optInt("minutes", 5).coerceIn(1, 999), o.optInt("startMin", -1))
                      }
                  } catch (e: Exception) { emptyList() }
              }
              fun saveStages(c: Context, l: List<Stage>) {
                  val a = JSONArray()
                  l.forEach { a.put(JSONObject().put("name", it.name).put("minutes", it.minutes).put("startMin", it.startMin)) }
                  sp(c).edit().putString("stages", a.toString()).apply()
              }

              fun loadLoopStages(c: Context): List<Stage> {
                  val raw = sp(c).getString("loop_stages", null) ?: return defaultLoopStages()
                  return try {
                      val a = JSONArray(raw)
                      if (a.length() == 0) defaultLoopStages()
                      else List(a.length()) { i ->
                          val o = a.getJSONObject(i)
                          Stage(o.optString("name", "阶段"), o.optInt("minutes", 5).coerceIn(1, 999), -1)
                      }
                  } catch (e: Exception) { defaultLoopStages() }
              }
              fun saveLoopStages(c: Context, l: List<Stage>) {
                  val a = JSONArray()
                  l.forEach { a.put(JSONObject().put("name", it.name).put("minutes", it.minutes)) }
                  sp(c).edit().putString("loop_stages", a.toString()).apply()
              }
              private fun defaultLoopStages() = listOf(Stage("工作", 30), Stage("休息", 5))

              fun loadLastTemplate(c: Context): List<Stage> {
                  val raw = sp(c).getString("last_template", null) ?: return emptyList()
                  return try {
                      val a = JSONArray(raw)
                      List(a.length()) { i ->
                          val o = a.getJSONObject(i)
                          Stage(o.optString("name"), o.optInt("minutes", 10), -1)
                      }
                  } catch (e: Exception) { emptyList() }
              }
              fun saveLastTemplate(c: Context, l: List<Stage>) {
                  val a = JSONArray()
                  l.forEach { a.put(JSONObject().put("name", it.name).put("minutes", it.minutes)) }
                  sp(c).edit().putString("last_template", a.toString()).apply()
              }

              fun loadLoop(c: Context) = sp(c).getBoolean("loop", true)
              fun saveLoop(c: Context, v: Boolean) = sp(c).edit().putBoolean("loop", v).apply()
              fun loadMode(c: Context) = sp(c).getInt("mode", 0)
              fun saveMode(c: Context, v: Int) = sp(c).edit().putInt("mode", v).apply()
              fun loadFree(c: Context) = sp(c).getInt("free", 25)
              fun saveFree(c: Context, v: Int) = sp(c).edit().putInt("free", v).apply()
              fun loadSound(c: Context) = sp(c).getBoolean("sound", true)
              fun saveSound(c: Context, v: Boolean) = sp(c).edit().putBoolean("sound", v).apply()
              fun loadVibrate(c: Context) = sp(c).getBoolean("vibrate", true)
              fun saveVibrate(c: Context, v: Boolean) = sp(c).edit().putBoolean("vibrate", v).apply()
              fun loadNotification(c: Context) = sp(c).getBoolean("notification", true)
              fun saveNotification(c: Context, v: Boolean) = sp(c).edit().putBoolean("notification", v).apply()
              fun loadRingtoneType(c: Context) = sp(c).getInt("ringtone_type", 0)
              fun saveRingtoneType(c: Context, v: Int) = sp(c).edit().putInt("ringtone_type", v).apply()
              fun loadRingDuration(c: Context) = sp(c).getInt("ring_duration", 30)
              fun saveRingDuration(c: Context, v: Int) = sp(c).edit().putInt("ring_duration", v).apply()
              fun loadScheduleEnabled(c: Context) = sp(c).getBoolean("schedule_enabled", false)
              fun saveScheduleEnabled(c: Context, v: Boolean) = sp(c).edit().putBoolean("schedule_enabled", v).apply()

              fun loadTasks(c: Context): List<Task> {
                  val raw = sp(c).getString("tasks", null) ?: return emptyList()
                  return try {
                      val a = JSONArray(raw)
                      List(a.length()) { i ->
                          val o = a.getJSONObject(i)
                          Task(o.optLong("id"), o.optString("title"), o.optBoolean("done"),
                              o.optLong("remindAt", 0L), o.optString("stageKey", ""), o.optString("note", ""),
                              o.optBoolean("remindSound", true),
                              o.optBoolean("remindVibrate", true),
                              o.optBoolean("remindNotification", true),
                              o.optInt("remindRingtoneType", 0),
                              o.optInt("remindRingDuration", 30))
                      }
                  } catch (e: Exception) { emptyList() }
              }
              fun saveTasks(c: Context, l: List<Task>) {
                  val a = JSONArray()
                  l.forEach {
                      a.put(JSONObject().put("id", it.id).put("title", it.title).put("done", it.done)
                          .put("remindAt", it.remindAt).put("stageKey", it.stageKey).put("note", it.note)
                          .put("remindSound", it.remindSound).put("remindVibrate", it.remindVibrate)
                          .put("remindNotification", it.remindNotification)
                          .put("remindRingtoneType", it.remindRingtoneType)
                          .put("remindRingDuration", it.remindRingDuration))
                  }
                  sp(c).edit().putString("tasks", a.toString()).apply()
              }
          }

          fun formatMs(ms: Long): String {
              val sec = (ms.coerceAtLeast(0) + 999) / 1000
              return "%02d:%02d".format(sec / 60, sec % 60)
          }
          fun formatHm(min: Int): String = "%02d:%02d".format(min / 60, min % 60)
          fun parseHm(s: String): Int? {
              val parts = s.trim().split(":")
              if (parts.size != 2) return null
              val h = parts[0].toIntOrNull() ?: return null
              val m = parts[1].toIntOrNull() ?: return null
              if (h !in 0..23 || m !in 0..59) return null
              return h * 60 + m
          }
          ST_EOF

          cat > app/src/main/java/com/example/looptimer/Lunar.kt <<'LU_EOF'
          package com.example.looptimer

          import java.time.LocalDate
          import java.time.temporal.ChronoUnit

          data class LunarDate(val year: Int, val month: Int, val day: Int, val isLeap: Boolean)

          object Lunar {
              private val lunarInfo = longArrayOf(
                  0x04bd8,0x04ae0,0x0a570,0x054d5,0x0d260,0x0d950,0x16554,0x056a0,0x09ad0,0x055d2,
                  0x04ae0,0x0a5b6,0x0a4d0,0x0d250,0x1d255,0x0b540,0x0d6a0,0x0ada2,0x095b0,0x14977,
                  0x04970,0x0a4b0,0x0b4b5,0x06a50,0x06d40,0x1ab54,0x02b60,0x09570,0x052f2,0x04970,
                  0x06566,0x0d4a0,0x0ea50,0x06e95,0x05ad0,0x02b60,0x186e3,0x092e0,0x1c8d7,0x0c950,
                  0x0d4a0,0x1d8a6,0x0b550,0x056a0,0x1a5b4,0x025d0,0x092d0,0x0d2b2,0x0a950,0x0b557,
                  0x06ca0,0x0b550,0x15355,0x04da0,0x0a5b0,0x14573,0x052b0,0x0a9a8,0x0e950,0x06aa0,
                  0x0aea6,0x0ab50,0x04b60,0x0aae4,0x0a570,0x05260,0x0f263,0x0d950,0x05b57,0x056a0,
                  0x096d0,0x04dd5,0x04ad0,0x0a4d0,0x0d4d4,0x0d250,0x0d558,0x0b540,0x0b6a0,0x195a6,
                  0x095b0,0x049b0,0x0a974,0x0a4b0,0x0b27a,0x06a50,0x06d40,0x0af46,0x0ab60,0x09570,
                  0x04af5,0x04970,0x064b0,0x074a3,0x0ea50,0x06b58,0x055c0,0x0ab60,0x096d5,0x092e0,
                  0x0c960,0x0d954,0x0d4a0,0x0da50,0x07552,0x056a0,0x0abb7,0x025d0,0x092d0,0x0cab5,
                  0x0a950,0x0b4a0,0x0baa4,0x0ad50,0x055d9,0x04ba0,0x0a5b0,0x15176,0x052b0,0x0a930,
                  0x07954,0x06aa0,0x0ad50,0x05b52,0x04b60,0x0a6e6,0x0a4e0,0x0d260,0x0ea65,0x0d530,
                  0x05aa0,0x076a3,0x096d0,0x04afb,0x04ad0,0x0a4d0,0x1d0b6,0x0d250,0x0d520,0x0dd45,
                  0x0b5a0,0x056d0,0x055b2,0x049b0,0x0a577,0x0a4b0,0x0aa50,0x1b255,0x06d20,0x0ada0,
                  0x14b63,0x09370,0x049f8,0x04970,0x064b0,0x168a6,0x0ea50,0x06b20,0x1a6c4,0x0aae0,
                  0x092e0,0x0d2e3,0x0c960,0x0d557,0x0d4a0,0x0da50,0x05d55,0x056a0,0x0a6d0,0x055d4,
                  0x052d0,0x0a9b8,0x0a950,0x0b4a0,0x0b6a6,0x0ad50,0x055a0,0x0aba4,0x0a5b0,0x052b0,
                  0x0b273,0x06930,0x07337,0x06aa0,0x0ad50,0x14b55,0x04b60,0x0a570,0x054e4,0x0d160,
                  0x0e968,0x0d520,0x0daa0,0x16aa6,0x056d0,0x04ae0,0x0a9d4,0x0a2d0,0x0d150,0x0f252,
                  0x0d520
              )
              private fun yearDays(y: Int): Int {
                  var sum = 348; var i = 0x8000
                  while (i > 0x8) { if (lunarInfo[y - 1900] and i.toLong() != 0L) sum++; i = i shr 1 }
                  return sum + leapDays(y)
              }
              private fun leapMonth(y: Int): Int = (lunarInfo[y - 1900] and 0xf).toInt()
              private fun leapDays(y: Int): Int {
                  if (leapMonth(y) == 0) return 0
                  return if (lunarInfo[y - 1900] and 0x10000L != 0L) 30 else 29
              }
              private fun monthDays(y: Int, m: Int): Int =
                  if (lunarInfo[y - 1900] and (0x10000L shr m) != 0L) 30 else 29

              fun fromSolar(date: LocalDate): LunarDate {
                  val base = LocalDate.of(1900, 1, 31)
                  val offset = ChronoUnit.DAYS.between(base, date).toInt()
                  if (offset < 0) return LunarDate(date.year, date.monthValue, date.dayOfMonth, false)
                  var remain = offset; var year = 1900
                  while (year < 2100) {
                      val yd = yearDays(year)
                      if (remain < yd) break
                      remain -= yd; year++
                  }
                  val leap = leapMonth(year); var isLeap = false; var month = 1
                  while (month <= 12) {
                      val md: Int
                      if (leap > 0 && month == leap + 1 && !isLeap) { md = leapDays(year); isLeap = true; month-- }
                      else md = monthDays(year, month)
                      if (remain < md) break
                      remain -= md
                      if (isLeap && month == leap + 1) isLeap = false
                      month++
                  }
                  return LunarDate(year, month, remain + 1, isLeap)
              }

              private val dayNames = arrayOf(
                  "初一","初二","初三","初四","初五","初六","初七","初八","初九","初十",
                  "十一","十二","十三","十四","十五","十六","十七","十八","十九","二十",
                  "廿一","廿二","廿三","廿四","廿五","廿六","廿七","廿八","廿九","三十"
              )
              private val monthNames = arrayOf("正","二","三","四","五","六","七","八","九","十","冬","腊")

              fun dayName(d: Int): String = if (d in 1..30) dayNames[d - 1] else ""
              fun monthName(m: Int, leap: Boolean): String {
                  val base = if (m in 1..12) monthNames[m - 1] + "月" else ""
                  return if (leap) "闰$base" else base
              }

              private val specialMap: Map<Int, String> = mapOf(
                  101 to "元", 110 to "警", 214 to "情", 305 to "雷", 308 to "妇", 312 to "树",
                  315 to "消", 401 to "愚", 422 to "球", 501 to "劳", 504 to "青", 512 to "护",
                  518 to "博", 520 to "白", 521 to "白", 525 to "心", 531 to "烟", 601 to "童",
                  605 to "环", 606 to "眼", 626 to "毒", 701 to "党", 707 to "抗", 801 to "军",
                  808 to "健", 903 to "胜", 910 to "师", 920 to "牙", 1001 to "国", 1010 to "神",
                  1016 to "粮", 1024 to "程", 1108 to "记", 1109 to "消", 1111 to "11",
                  1201 to "艾", 1203 to "残", 1204 to "宪", 1213 to "祭", 1224 to "平", 1225 to "圣"
              )
              private val specialFullMap: Map<Int, String> = mapOf(
                  101 to "元旦", 110 to "警察节", 214 to "情人节", 305 to "学雷锋日",
                  308 to "妇女节", 312 to "植树节", 315 to "消费者日", 401 to "愚人节",
                  422 to "地球日", 501 to "劳动节", 504 to "青年节", 512 to "护士节",
                  518 to "博物馆日", 520 to "表白日", 521 to "表白日", 525 to "心理健康节",
                  531 to "无烟日", 601 to "儿童节", 605 to "环境日", 606 to "爱眼日",
                  626 to "禁毒日", 701 to "建党节", 707 to "抗战纪念日", 801 to "建军节",
                  808 to "全民健身日", 903 to "抗战胜利日", 910 to "教师节", 920 to "爱牙日",
                  1001 to "国庆节", 1010 to "精神卫生日", 1016 to "粮食日", 1024 to "程序员节",
                  1108 to "记者节", 1109 to "消防日", 1111 to "双十一", 1201 to "艾滋病日",
                  1203 to "残疾人日", 1204 to "宪法日", 1213 to "公祭日", 1224 to "平安夜",
                  1225 to "圣诞节"
              )
              fun specialShort(d: LocalDate): String? = specialMap[d.monthValue * 100 + d.dayOfMonth]
              fun specialOf(d: LocalDate): String? = specialFullMap[d.monthValue * 100 + d.dayOfMonth]

              fun lunarFestivalShort(l: LunarDate): String? = when {
                  l.isLeap -> null
                  l.month == 1 && l.day == 1 -> "春"
                  l.month == 1 && l.day == 15 -> "宵"
                  l.month == 2 && l.day == 2 -> "龙"
                  l.month == 5 && l.day == 5 -> "端"
                  l.month == 7 && l.day == 7 -> "夕"
                  l.month == 7 && l.day == 15 -> "元"
                  l.month == 8 && l.day == 15 -> "中"
                  l.month == 9 && l.day == 9 -> "重"
                  l.month == 12 && l.day == 8 -> "腊"
                  l.month == 12 && l.day == 23 -> "小"
                  else -> null
              }
              fun lunarFestivalFull(l: LunarDate): String? = when {
                  l.isLeap -> null
                  l.month == 1 && l.day == 1 -> "春节"
                  l.month == 1 && l.day == 15 -> "元宵节"
                  l.month == 2 && l.day == 2 -> "龙抬头"
                  l.month == 5 && l.day == 5 -> "端午节"
                  l.month == 7 && l.day == 7 -> "七夕节"
                  l.month == 7 && l.day == 15 -> "中元节"
                  l.month == 8 && l.day == 15 -> "中秋节"
                  l.month == 9 && l.day == 9 -> "重阳节"
                  l.month == 12 && l.day == 8 -> "腊八节"
                  l.month == 12 && l.day == 23 -> "小年"
                  else -> null
              }

              fun legalHoliday(d: LocalDate): String? {
                  val md = d.monthValue * 100 + d.dayOfMonth
                  return when (md) {
                      101 -> "元旦"; 501 -> "劳动节"; 1001,1002,1003 -> "国庆"
                      else -> null
                  }
              }

              fun dayShortLabel(d: LocalDate): String {
                  specialShort(d)?.let { return it }
                  val l = fromSolar(d)
                  lunarFestivalShort(l)?.let { return it }
                  if (l.day == 1) return if (l.month in 1..12) monthNames[l.month - 1] else ""
                  return dayName(l.day)
              }
              fun lunarText(date: LocalDate): String {
                  val l = fromSolar(date)
                  return "${l.year}年${monthName(l.month, l.isLeap)}${dayName(l.day)}"
              }
              fun workMark(d: LocalDate): String {
                  val wd = d.dayOfWeek.value
                  if (legalHoliday(d) != null) return "休"
                  return if (wd == 6 || wd == 7) "休" else "工"
              }
          }
          LU_EOF

          cat > app/src/main/java/com/example/looptimer/ReminderReceiver.kt <<'RR_EOF'
          package com.example.looptimer

          import android.Manifest
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.BroadcastReceiver
          import android.content.Context
