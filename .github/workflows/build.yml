                                  })
                                  Column(Modifier.weight(1f).clickable { editing = task }) {
                                      Text(
                                          task.title,
                                          textDecoration = if (task.done) TextDecoration.LineThrough else null,
                                          color = if (task.done) MaterialTheme.colorScheme.onSurfaceVariant else MaterialTheme.colorScheme.onSurface
                                      )
                                      if (task.remindAt > 0) {
                                          val dt = java.time.Instant.ofEpochMilli(task.remindAt).atZone(ZoneId.systemDefault()).toLocalDateTime()
                                          Text("⏰ " + dt.format(DateTimeFormatter.ofPattern("MM-dd HH:mm")),
                                              style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.primary)
                                      }
                                      if (task.stageKey.isNotBlank()) {
                                          Text("🕒 阶段 " + task.stageKey,
                                              style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.tertiary)
                                      }
                                  }
                                  IconButton({ editing = task }) {
                                      Icon(Icons.Default.Notifications, contentDescription = "编辑提醒",
                                          tint = if (task.remindAt > 0 || task.stageKey.isNotBlank()) MaterialTheme.colorScheme.primary else MaterialTheme.colorScheme.onSurfaceVariant)
                                  }
                                  IconButton({ update(tasks.filterNot { it.id == task.id }) }) {
                                      Icon(Icons.Default.Close, contentDescription = "删")
                                  }
                              }
                          }
                      }
                  }
