                          if (error.isNotBlank()) Text(error, color = MaterialTheme.colorScheme.error, style = MaterialTheme.typography.bodySmall)
                          Spacer(Modifier.height(8.dp))
                          Text("关联阶段（下拉）", style = MaterialTheme.typography.bodySmall)
                          if (stages.isEmpty()) Text("请先在计时 Tab 创建阶段", style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.onSurfaceVariant)
                          else StageDropdown(stages, stageKey) { stageKey = it }

                          Spacer(Modifier.height(10.dp))
                          HorizontalDivider()
                          Spacer(Modifier.height(6.dp))
                          Text("提醒方式", style = MaterialTheme.typography.titleSmall)
                          Row(verticalAlignment = Alignment.CenterVertically) { Text("响铃", Modifier.weight(1f)); Switch(soundOn, { soundOn = it }) }
                          Row(verticalAlignment = Alignment.CenterVertically) { Text("通知", Modifier.weight(1f)); Switch(notificationOn, { notificationOn = it }) }
                          Row(verticalAlignment = Alignment.CenterVertically) { Text("震动", Modifier.weight(1f)); Switch(vibrateOn, { vibrateOn = it }) }
                          Spacer(Modifier.height(4.dp))
                          Text("铃声类型", style = MaterialTheme.typography.bodySmall)
                          Row(horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                              FilterChip(ringtoneType == 0, { ringtoneType = 0 }, label = { Text("闹钟") })
                              FilterChip(ringtoneType == 1, { ringtoneType = 1 }, label = { Text("通知音") })
                              FilterChip(ringtoneType == 2, { ringtoneType = 2 }, label = { Text("静音") })
                          }
                          Spacer(Modifier.height(4.dp))
                          Row(verticalAlignment = Alignment.CenterVertically) {
                              Text("响铃时长", Modifier.weight(1f))
                              CompactTextField(ringDurationText, { v ->
                                  ringDurationText = v.filter { it.isDigit() }.take(2)
                              }, Modifier.width(48.dp), true, "秒", KeyboardType.Number)
                              Spacer(Modifier.width(6.dp))
                              Text("秒", style = MaterialTheme.typography.bodySmall)
                          }
                      }
                  },
                  confirmButton = {
                      TextButton({
                          if (title.isBlank()) { error = "请填写标题"; return@TextButton }
                          val date = try { LocalDate.parse(dateText.trim()) } catch (e: Exception) { null }
                          val time = try { LocalTime.parse(timeText.trim()) } catch (e: Exception) { null }
                          if (date == null || time == null) error = "日期或时间格式错误"
                          else {
                              val dt = LocalDateTime.of(date, time)
                              val ms = dt.atZone(ZoneId.systemDefault()).toInstant().toEpochMilli()
                              val dur = ringDurationText.toIntOrNull() ?: 30
                              onSave(task.copy(
                                  title = title.trim(), note = note.trim(), stageKey = stageKey,
                                  remindSound = soundOn, remindVibrate = vibrateOn,
                                  remindNotification = notificationOn,
                                  remindRingtoneType = ringtoneType,
                                  remindRingDuration = dur
