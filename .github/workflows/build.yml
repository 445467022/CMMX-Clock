                      TextButton(onClick = { val t = LocalDate.now(); anchor = t; selected = t }) { Text("今天") }
                      TextButton(onClick = {
                          val all = sectionExpanded.values.all { it }
                          sectionExpanded["day"] = !all; sectionExpanded["week"] = !all; sectionExpanded["month"] = !all
                      }) { Text(if (sectionExpanded.values.all { it }) "全部折叠" else "全部展开") }
                      IconButton({ editing = Task(0L, "") }) { Icon(Icons.Default.Notifications, contentDescription = "添加") }
                  }
                  Row(verticalAlignment = Alignment.CenterVertically) {
                      IconButton({ anchor = when (viewMode) { 0 -> anchor.minusDays(1); 1 -> anchor.minusWeeks(1); else -> anchor.minusMonths(1) } }) { Text("‹") }
                      Text(headerText(viewMode, anchor), Modifier.weight(1f), textAlign = TextAlign.Center, style = MaterialTheme.typography.titleMedium)
                      IconButton({ anchor = when (viewMode) { 0 -> anchor.plusDays(1); 1 -> anchor.plusWeeks(1); else -> anchor.plusMonths(1) } }) { Text("›") }
                  }
                  Spacer(Modifier.height(4.dp))
                  when (viewMode) {
                      0 -> DayView(selected, tasks) { selected = it; }
                      1 -> WeekView(anchor, selected, tasks, sectionExpanded["week"] ?: true,
                          toggleWeek = { sectionExpanded["week"] = !(sectionExpanded["week"] ?: true) },
                          onSelect = { selected = it },
                          onEdit = { editing = it })
                      else -> MonthView(anchor, selected, tasks, sectionExpanded["month"] ?: true,
                          toggleMonth = { sectionExpanded["month"] = !(sectionExpanded["month"] ?: true) },
                          onSelect = { selected = it },
                          onEdit = { editing = it })
                  }
              }

              editing?.let { task ->
                  TaskDialog(task, allStages, onDismiss = { editing = null }) { updated, remindAt ->
                      val isNew = updated.id == 0L || tasks.none { it.id == updated.id }
                      val id = if (updated.id == 0L) System.currentTimeMillis() else updated.id
                      val finalTask = updated.copy(id = id, remindAt = remindAt)
                      val newList = if (isNew) tasks + finalTask else tasks.map { if (it.id == task.id) finalTask else it }
                      update(newList)
                      if (remindAt > 0) scheduleReminder(ctx, id.toInt(), finalTask.title, remindAt)
                      editing = null
                  }
              }
          }

          fun headerText(mode: Int, anchor: LocalDate): String = when (mode) {
              0 -> anchor.format(DateTimeFormatter.ofPattern("yyyy年MM月dd日"))
              1 -> {
                  val s = anchor.minusDays((anchor.dayOfWeek.value - 1).toLong())
                  val e = s.plusDays(6)
                  "${s.monthValue}/${s.dayOfMonth} - ${e.monthValue}/${e.dayOfMonth}"
              }
              else -> "${anchor.year}年${anchor.monthValue}月"
          }

          @Composable
          fun DayDetails(selected: LocalDate, tasks: List<Task>, onEdit: (Task) -> Unit) {
              Card(Modifier.fillMaxWidth()) {
                  Column(Modifier.padding(10.dp)) {
                      Text(selected.format(DateTimeFormatter.ofPattern("yyyy年MM月dd日 EEEE")), style = MaterialTheme.typography.titleMedium)
                      val lunar = Lunar.fromSolar(selected)
                      Text("农历 " + Lunar.lunarText(selected), color = MaterialTheme.colorScheme.primary, style = MaterialTheme.typography.bodySmall)
                      val h = Lunar.legalHoliday(selected)
                      val sp = Lunar.specialOf(selected)
                      val lf = Lunar.lunarFestivalFull(lunar)
                      if (h != null) Text("🎉 $h", color = MaterialTheme.colorScheme.error, style = MaterialTheme.typography.bodySmall)
                      if (lf != null) Text("🏮 $lf", color = MaterialTheme.colorScheme.error, style = MaterialTheme.typography.bodySmall)
                      if (sp != null) Text("✨ $sp", color = MaterialTheme.colorScheme.tertiary, style = MaterialTheme.typography.bodySmall)
                      Text(Lunar.workMark(selected), style = MaterialTheme.typography.bodySmall,
                          color = if (Lunar.workMark(selected) == "休") MaterialTheme.colorScheme.secondary else MaterialTheme.colorScheme.onSurfaceVariant)
                  }
              }
              Spacer(Modifier.height(8.dp))
              Text("当日待办", style = MaterialTheme.typography.titleMedium)
              val dayTasks = tasks.filter {
                  it.remindAt > 0 && java.time.Instant.ofEpochMilli(it.remindAt).atZone(ZoneId.systemDefault()).toLocalDate() == selected
              }
              if (dayTasks.isEmpty()) Text("暂无待办", color = MaterialTheme.colorScheme.onSurfaceVariant, modifier = Modifier.padding(vertical = 6.dp), style = MaterialTheme.typography.bodySmall)
              else dayTasks.forEach { e ->
                  val t = java.time.Instant.ofEpochMilli(e.remindAt).atZone(ZoneId.systemDefault()).toLocalTime()
                  Card(Modifier.fillMaxWidth().padding(vertical = 3.dp).clickable { onEdit(e) }) {
                      Row(Modifier.padding(8.dp), verticalAlignment = Alignment.CenterVertically) {
                          Text(t.format(DateTimeFormatter.ofPattern("HH:mm")), Modifier.widthIn(min = 52.dp),
                              fontWeight = FontWeight.Bold, color = MaterialTheme.colorScheme.primary, style = MaterialTheme.typography.bodyMedium)
                          Text(e.title, modifier = Modifier.weight(1f), textDecoration = if (e.done) TextDecoration.LineThrough else null)
                          if (e.stageKey.isNotBlank()) Text("🕒 " + e.stageKey, style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.tertiary)
                      }
                  }
              }
          }

          @Composable
          fun CollapsibleHeader(title: String, expanded: Boolean, onToggle: () -> Unit) {
              Row(Modifier.fillMaxWidth().padding(top = 6.dp).clickable { onToggle() }, verticalAlignment = Alignment.CenterVertically) {
                  Text(title, style = MaterialTheme.typography.titleMedium, modifier = Modifier.weight(1f))
                  Text(if (expanded) "▼" else "▶")
              }
          }

          @Composable
          fun DayView(selected: LocalDate, tasks: List<Task>, onSelect: (LocalDate) -> Unit) {
              Column(Modifier.fillMaxSize().verticalScroll(rememberScrollState())) {
                  DayDetails(selected, tasks, onEdit = {})
                  Spacer(Modifier.height(60.dp))
              }
          }

          @Composable
          fun WeekView(anchor: LocalDate, selected: LocalDate, tasks: List<Task>, expanded: Boolean,
                       toggleWeek: () -> Unit, onSelect: (LocalDate) -> Unit, onEdit: (Task) -> Unit) {
              val weekStart = anchor.minusDays((anchor.dayOfWeek.value - 1).toLong())
              val weekEnd = weekStart.plusDays(6)
              Column(Modifier.fillMaxSize().verticalScroll(rememberScrollState())) {
                  Row(Modifier.fillMaxWidth()) {
                      for (i in 0..6) {
                          val d = weekStart.plusDays(i.toLong())
                          val isSel = d == selected
                          val isRest = Lunar.workMark(d) == "休"
                          val bg = if (isSel) MaterialTheme.colorScheme.primary else MaterialTheme.colorScheme.surface
                          val fg = if (isSel) MaterialTheme.colorScheme.onPrimary else if (isRest) Color(0xFFD32F2F) else MaterialTheme.colorScheme.onSurface
                          Column(Modifier.weight(1f).padding(1.dp).clip(RoundedCornerShape(8.dp))
                              .background(bg).clickable { onSelect(d) }.padding(vertical = 5.dp),
                              horizontalAlignment = Alignment.CenterHorizontally) {
                              Text(dayOfWeekShort(d.dayOfWeek.value), fontSize = 10.sp, color = fg)
                              Text("${d.dayOfMonth}", fontSize = 16.sp, fontWeight = FontWeight.Bold, color = fg)
                              Text(Lunar.dayShortLabel(d), fontSize = 9.sp, color = fg, maxLines = 1)
                          }
                      }
                  }
                  Spacer(Modifier.height(6.dp))
                  DayDetails(selected, tasks, onEdit)
                  CollapsibleHeader("本周全部待办", expanded, toggleWeek)
                  if (expanded) {
                      val weekTasks = tasks.filter {
                          if (it.remindAt <= 0) return@filter false
                          val d = java.time.Instant.ofEpochMilli(it.remindAt).atZone(ZoneId.systemDefault()).toLocalDate()
                          !d.isBefore(weekStart) && !d.isAfter(weekEnd)
                      }.sortedBy { it.remindAt }
                      if (weekTasks.isEmpty()) Text("本周暂无待办", color = MaterialTheme.colorScheme.onSurfaceVariant, style = MaterialTheme.typography.bodySmall, modifier = Modifier.padding(vertical = 4.dp))
                      else weekTasks.forEach { e ->
                          Card(Modifier.fillMaxWidth().padding(vertical = 2.dp).clickable { onEdit(e) }) {
                              Row(Modifier.padding(8.dp), verticalAlignment = Alignment.CenterVertically) {
                                  val dt = java.time.Instant.ofEpochMilli(e.remindAt).atZone(ZoneId.systemDefault())
                                  Text(dt.format(DateTimeFormatter.ofPattern("MM-dd HH:mm")), Modifier.widthIn(min = 100.dp),
                                      fontWeight = FontWeight.Bold, color = MaterialTheme.colorScheme.primary, style = MaterialTheme.typography.bodySmall)
                                  Text(e.title, modifier = Modifier.weight(1f), textDecoration = if (e.done) TextDecoration.LineThrough else null, style = MaterialTheme.typography.bodyMedium)
                              }
                          }
                      }
                  }
                  Spacer(Modifier.height(60.dp))
              }
          }

          @Composable
          fun MonthView(anchor: LocalDate, selected: LocalDate, tasks: List<Task>, expanded: Boolean,
                        toggleMonth: () -> Unit, onSelect: (LocalDate) -> Unit, onEdit: (Task) -> Unit) {
              val ym = YearMonth.of(anchor.year, anchor.monthValue)
              val firstDay = ym.atDay(1)
              val startOffset = (firstDay.dayOfWeek.value + 6) % 7
              val daysInMonth = ym.lengthOfMonth()
              val rows = (startOffset + daysInMonth + 6) / 7
              Column(Modifier.fillMaxSize().verticalScroll(rememberScrollState())) {
                  Row(Modifier.fillMaxWidth()) {
                      listOf("一","二","三","四","五","六","日").forEach {
                          Text(it, Modifier.weight(1f), textAlign = TextAlign.Center, fontSize = 11.sp, color = MaterialTheme.colorScheme.onSurfaceVariant, fontWeight = FontWeight.Bold)
                      }
                  }
                  for (r in 0 until rows) {
                      Row(Modifier.fillMaxWidth()) {
                          for (c in 0..6) {
                              val cellIdx = r * 7 + c
                              val dayNum = cellIdx - startOffset + 1
                              if (dayNum in 1..daysInMonth) {
                                  val d = ym.atDay(dayNum)
                                  val isSel = d == selected
                                  val isToday = d == LocalDate.now()
                                  val isRest = Lunar.workMark(d) == "休"
                                  val specialShort = Lunar.specialShort(d) ?: Lunar.lunarFestivalShort(Lunar.fromSolar(d))
                                  val bg = when { isSel -> MaterialTheme.colorScheme.primary; isToday -> MaterialTheme.colorScheme.primaryContainer; else -> MaterialTheme.colorScheme.surface }
                                  val numColor = when { isSel -> MaterialTheme.colorScheme.onPrimary; isRest -> Color(0xFFD32F2F); else -> MaterialTheme.colorScheme.onSurface }
                                  val hasEvent = tasks.any { it.remindAt > 0 && java.time.Instant.ofEpochMilli(it.remindAt).atZone(ZoneId.systemDefault()).toLocalDate() == d }
                                  Column(
                                      Modifier.weight(1f).aspectRatio(0.9f).padding(1.dp).clip(RoundedCornerShape(5.dp)).background(bg).clickable { onSelect(d) }.padding(1.dp),
                                      horizontalAlignment = Alignment.CenterHorizontally, verticalArrangement = Arrangement.Center
                                  ) {
                                      Text("$dayNum", fontSize = 13.sp, fontWeight = FontWeight.Bold, color = numColor)
                                      val sub = specialShort ?: Lunar.dayShortLabel(d)
                                      val subColor = when { specialShort != null && !isSel -> Color(0xFFD32F2F); else -> if (isSel) MaterialTheme.colorScheme.onPrimary else MaterialTheme.colorScheme.onSurfaceVariant }
                                      Text(sub, fontSize = 8.sp, color = subColor, maxLines = 1)
                                      if (hasEvent) Box(Modifier.size(3.dp).clip(CircleShape).background(MaterialTheme.colorScheme.error))
                                  }
                              } else Spacer(Modifier.weight(1f).aspectRatio(0.9f).padding(1.dp))
                          }
                      }
                  }
                  Spacer(Modifier.height(6.dp))
                  DayDetails(selected, tasks, onEdit)
                  CollapsibleHeader("本月全部待办", expanded, toggleMonth)
                  if (expanded) {
                      val monthStart = ym.atDay(1)
                      val monthEnd = ym.atEndOfMonth()
                      val monthTasks = tasks.filter {
                          if (it.remindAt <= 0) return@filter false
                          val d = java.time.Instant.ofEpochMilli(it.remindAt).atZone(ZoneId.systemDefault()).toLocalDate()
                          !d.isBefore(monthStart) && !d.isAfter(monthEnd)
                      }.sortedBy { it.remindAt }
                      if (monthTasks.isEmpty()) Text("本月暂无待办", color = MaterialTheme.colorScheme.onSurfaceVariant, style = MaterialTheme.typography.bodySmall, modifier = Modifier.padding(vertical = 4.dp))
                      else monthTasks.forEach { e ->
                          Card(Modifier.fillMaxWidth().padding(vertical = 2.dp).clickable { onEdit(e) }) {
                              Row(Modifier.padding(8.dp), verticalAlignment = Alignment.CenterVertically) {
                                  val dt = java.time.Instant.ofEpochMilli(e.remindAt).atZone(ZoneId.systemDefault())
                                  Text(dt.format(DateTimeFormatter.ofPattern("MM-dd HH:mm")), Modifier.widthIn(min = 100.dp),
                                      fontWeight = FontWeight.Bold, color = MaterialTheme.colorScheme.primary, style = MaterialTheme.typography.bodySmall)
                                  Text(e.title, modifier = Modifier.weight(1f), textDecoration = if (e.done) TextDecoration.LineThrough else null, style = MaterialTheme.typography.bodyMedium)
                              }
                          }
                      }
                  }
                  Spacer(Modifier.height(60.dp))
              }
          }

          fun dayOfWeekShort(d: Int): String = when (d) { 1->"一";2->"二";3->"三";4->"四";5->"五";6->"六";else->"日" }
          MA_EOF

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk LoopTimer.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LoopTimer-apk
          path: LoopTimer.apk
