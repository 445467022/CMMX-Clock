                                      )
                                      if (todo.remindAt > 0) {
                                          val dt = java.time.Instant.ofEpochMilli(todo.remindAt)
                                              .atZone(ZoneId.systemDefault()).toLocalDateTime()
                                          Text("⏰ " + dt.format(DateTimeFormatter.ofPattern("MM-dd HH:mm")),
                                              style = MaterialTheme.typography.bodySmall,
                                              color = MaterialTheme.colorScheme.primary)
                                      }
                                  }
                                  IconButton({ pickerTarget = todo }) {
                                      Icon(Icons.Default.Notifications, contentDescription = "提醒", tint = if (todo.remindAt > 0) MaterialTheme.colorScheme.primary else MaterialTheme.colorScheme.onSurfaceVariant)
                                  }
                                  IconButton({ update(todos.filterNot { it.id == todo.id }) }) {
                                      Icon(Icons.Default.Close, contentDescription = "删")
                                  }
                              }
                          }
                      }
                  }
              }

              pickerTarget?.let { todo ->
                  TodoRemindDialog(todo = todo, onDismiss = { pickerTarget = null }) { timeMs ->
                      val updated = todos.map { if (it.id == todo.id) it.copy(remindAt = timeMs) else it }
                      update(updated)
                      scheduleReminder(ctx, todo.id.toInt(), todo.text, timeMs)
                      pickerTarget = null
                  }
              }
          }

          @Composable
          fun TodoRemindDialog(todo: Todo, onDismiss: () -> Unit, onConfirm: (Long) -> Unit) {
              val now = remember { LocalDateTime.now().plusHours(1) }
              var date by remember { mutableStateOf(now.toLocalDate()) }
              var hour by remember { mutableIntStateOf(now.hour) }
              var minute by remember { mutableIntStateOf(0) }

              AlertDialog(
                  onDismissRequest = onDismiss,
                  confirmButton = {
                      TextButton({
                          val dt = LocalDateTime.of(date, LocalTime.of(hour, minute))
                          onConfirm(dt.atZone(ZoneId.systemDefault()).toInstant().toEpochMilli())
                      }) { Text("确定") }
                  },
                  dismissButton = {
                      TextButton({
                          onConfirm(0L)  // 取消提醒
                          onDismiss()
                      }) { Text("取消提醒") }
                  },
                  title = { Text("设置提醒：${todo.text}") },
                  text = {
                      Column {
                          Row(verticalAlignment = Alignment.CenterVertically) {
                              Text("日期", modifier = Modifier.weight(1f)); Text(date.toString())
                          }
                          Row(horizontalArrangement = Arrangement.spacedBy(8.dp), modifier = Modifier.padding(vertical = 4.dp)) {
                              IconButton({ date = date.minusDays(1) }) { Text("−日") }
                              IconButton({ date = date.plusDays(1) }) { Text("+日") }
                          }
                          Row(verticalAlignment = Alignment.CenterVertically) {
                              Text("时", modifier = Modifier.weight(1f))
                              IconButton({ hour = (hour - 1 + 24) % 24 }) { Text("−") }
                              Text("$hour", Modifier.widthIn(min = 40.dp), textAlign = TextAlign.Center)
                              IconButton({ hour = (hour + 1) % 24 }) { Text("+") }
                          }
                          Row(verticalAlignment = Alignment.CenterVertically) {
                              Text("分", modifier = Modifier.weight(1f))
                              IconButton({ minute = (minute - 5 + 60) % 60 }) { Text("−5") }
                              Text("$minute", Modifier.widthIn(min = 40.dp), textAlign = TextAlign.Center)
                              IconButton({ minute = (minute + 5) % 60 }) { Text("+5") }
                          }
                      }
                  }
              )
          }

          fun scheduleReminder(ctx: Context, id: Int, title: String, timeMs: Long) {
              if (timeMs <= System.currentTimeMillis()) return
              try {
                  val am = ctx.getSystemService(AlarmManager::class.java) ?: return
                  val intent = Intent(ctx, ReminderReceiver::class.java).apply {
                      putExtra("id", id); putExtra("title", title)
                  }
                  val pi = PendingIntent.getBroadcast(ctx, id, intent, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                      if (am.canScheduleExactAlarms()) am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, timeMs, pi)
                      else am.set(AlarmManager.RTC_WAKEUP, timeMs, pi)
                  } else {
                      am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, timeMs, pi)
                  }
              } catch (e: Exception) {}
          }

          // ================================================================ 日历
          @Composable
          fun CalendarTab() {
              val ctx = LocalContext.current
              var viewMode by remember { mutableIntStateOf(1) }  // 0 日 1 周 2 月
              var anchor by remember { mutableStateOf(LocalDate.now()) }
              var selected by remember { mutableStateOf(LocalDate.now()) }
              var events by remember { mutableStateOf(Store.loadEvents(ctx)) }
              var showAddDialog by remember { mutableStateOf(false) }

              Column(Modifier.fillMaxSize().padding(12.dp)) {
                  Row(verticalAlignment = Alignment.CenterVertically) {
                      FilterChip(viewMode == 0, { viewMode = 0 }, label = { Text("日") })
                      Spacer(Modifier.width(6.dp))
                      FilterChip(viewMode == 1, { viewMode = 1 }, label = { Text("周") })
                      Spacer(Modifier.width(6.dp))
                      FilterChip(viewMode == 2, { viewMode = 2 }, label = { Text("月") })
                      Spacer(Modifier.weight(1f))
                      IconButton({ showAddDialog = true }) {
                          Icon(Icons.Default.Notifications, contentDescription = "添加事件")
                      }
                  }

                  Row(verticalAlignment = Alignment.CenterVertically) {
                      IconButton({
                          anchor = when (viewMode) {
                              0 -> anchor.minusDays(1)
                              1 -> anchor.minusWeeks(1)
                              else -> anchor.minusMonths(1)
                          }
                      }) { Text("‹") }
                      Text(headerText(viewMode, anchor), Modifier.weight(1f), textAlign = TextAlign.Center,
                          style = MaterialTheme.typography.titleMedium)
                      IconButton({
                          anchor = when (viewMode) {
                              0 -> anchor.plusDays(1)
                              1 -> anchor.plusWeeks(1)
                              else -> anchor.plusMonths(1)
                          }
                      }) { Text("›") }
                  }

                  Spacer(Modifier.height(6.dp))

                  when (viewMode) {
                      0 -> DayView(selected, events) { selected = it }
                      1 -> WeekView(anchor, selected, events) { selected = it }
                      else -> MonthView(anchor, selected, events) { selected = it }
                  }
              }

              if (showAddDialog) {
                  AddEventDialog(
                      onDismiss = { showAddDialog = false },
                      onConfirm = { title, timeMs ->
                          events = events + CalEvent(System.currentTimeMillis(), title, timeMs)
                          Store.saveEvents(ctx, events)
                          scheduleReminder(ctx, (System.currentTimeMillis() % Int.MAX_VALUE).toInt(), title, timeMs)
                          showAddDialog = false
                      },
                      initialDate = selected
                  )
              }
          }

          fun headerText(mode: Int, anchor: LocalDate): String = when (mode) {
              0 -> anchor.format(DateTimeFormatter.ofPattern("yyyy年MM月dd日")) + " · " + Lunar.lunarText(anchor)
              1 -> {
                  val start = anchor.minusDays((anchor.dayOfWeek.value - 1).toLong())
                  val end = start.plusDays(6)
                  "${start.monthValue}/${start.dayOfMonth} - ${end.monthValue}/${end.dayOfMonth}"
              }
              else -> "${anchor.year}年${anchor.monthValue}月"
          }

          @Composable
          fun DayView(selected: LocalDate, events: List<CalEvent>, onSelect: (LocalDate) -> Unit) {
              Column(Modifier.fillMaxSize().verticalScroll(rememberScrollState())) {
                  Card(Modifier.fillMaxWidth()) {
                      Column(Modifier.padding(16.dp)) {
                          Text(selected.format(DateTimeFormatter.ofPattern("yyyy年MM月dd日 EEEE")), style = MaterialTheme.typography.titleLarge)
                          Spacer(Modifier.height(4.dp))
                          Text("农历 " + Lunar.lunarText(selected), color = MaterialTheme.colorScheme.primary)
                          val h = Lunar.legalHoliday(selected)
                          val sp = Lunar.specialOf(selected)
                          if (h != null) Text("🎉 $h", color = MaterialTheme.colorScheme.error)
                          if (sp != null) Text("✨ $sp", color = MaterialTheme.colorScheme.tertiary)
                          val wd = selected.dayOfWeek.value
                          if (wd == 6 || wd == 7) Text("休息日", color = MaterialTheme.colorScheme.secondary)
                          else Text("工作日", color = MaterialTheme.colorScheme.onSurfaceVariant)
                      }
                  }
                  Spacer(Modifier.height(12.dp))
                  Text("当日事件", style = MaterialTheme.typography.titleMedium)
                  val dayEvents = events.filter {
                      val d = java.time.Instant.ofEpochMilli(it.timeMs).atZone(ZoneId.systemDefault()).toLocalDate()
                      d == selected
                  }
                  if (dayEvents.isEmpty()) {
                      Text("暂无事件", color = MaterialTheme.colorScheme.onSurfaceVariant, modifier = Modifier.padding(vertical = 8.dp))
                  } else {
                      dayEvents.forEach { e ->
                          val t = java.time.Instant.ofEpochMilli(e.timeMs).atZone(ZoneId.systemDefault()).toLocalTime()
                          Card(Modifier.fillMaxWidth().padding(vertical = 4.dp)) {
                              Row(Modifier.padding(12.dp)) {
                                  Text(t.format(DateTimeFormatter.ofPattern("HH:mm")), Modifier.widthIn(min = 60.dp),
                                      fontWeight = FontWeight.Bold, color = MaterialTheme.colorScheme.primary)
                                  Text(e.title, modifier = Modifier.weight(1f))
                              }
                          }
                      }
                  }
                  Spacer(Modifier.height(60.dp))
              }
          }

          @Composable
          fun WeekView(anchor: LocalDate, selected: LocalDate, events: List<CalEvent>, onSelect: (LocalDate) -> Unit) {
              val start = anchor.minusDays((anchor.dayOfWeek.value - 1).toLong())
              Column {
                  Row(Modifier.fillMaxWidth()) {
                      for (i in 0..6) {
                          val d = start.plusDays(i.toLong())
                          val isSel = d == selected
                          val bg = if (isSel) MaterialTheme.colorScheme.primary else MaterialTheme.colorScheme.surface
                          val fg = if (isSel) MaterialTheme.colorScheme.onPrimary else MaterialTheme.colorScheme.onSurface
                          Column(
                              Modifier.weight(1f).padding(2.dp).clip(RoundedCornerShape(8.dp))
                                  .background(bg).clickable { onSelect(d) }.padding(vertical = 8.dp),
                              horizontalAlignment = Alignment.CenterHorizontally
                          ) {
                              Text(dayOfWeekShort(d.dayOfWeek.value), fontSize = 11.sp, color = fg)
                              Text("${d.dayOfMonth}", fontSize = 18.sp, fontWeight = FontWeight.Bold, color = fg)
                              Text(Lunar.shortLabel(d), fontSize = 10.sp, color = fg, maxLines = 1)
                          }
                      }
                  }
                  Spacer(Modifier.height(12.dp))
                  DayView(selected, events, onSelect)
              }
          }

          @Composable
          fun MonthView(anchor: LocalDate, selected: LocalDate, events: List<CalEvent>, onSelect: (LocalDate) -> Unit) {
              val ym = YearMonth.of(anchor.year, anchor.monthValue)
              val firstDay = ym.atDay(1)
              val startOffset = (firstDay.dayOfWeek.value + 6) % 7  // 周一=0
              val daysInMonth = ym.lengthOfMonth()
              val totalCells = startOffset + daysInMonth
              val rows = (totalCells + 6) / 7

              Column {
                  Row(Modifier.fillMaxWidth()) {
                      listOf("一","二","三","四","五","六","日").forEach {
                          Text(it, Modifier.weight(1f), textAlign = TextAlign.Center,
                              fontSize = 12.sp, color = MaterialTheme.colorScheme.onSurfaceVariant, fontWeight = FontWeight.Bold)
                      }
                  }
                  for (r in 0 until rows) {
                      Row(Modifier.fillMaxWidth()) {
                          for (c in 0..6) {
                              val cellIdx = r * 7 + c
                              val dayNum = cellIdx - startOffset + 1
                              if (dayNum in 1..daysInMonth) {
                                  val d = ym.atDay(dayNum)
                                  val isSel = d == selected
                                  val isToday = d == LocalDate.now()
                                  val bg = when {
                                      isSel -> MaterialTheme.colorScheme.primary
                                      isToday -> MaterialTheme.colorScheme.primaryContainer
                                      else -> MaterialTheme.colorScheme.surface
                                  }
                                  val fg = when {
                                      isSel -> MaterialTheme.colorScheme.onPrimary
                                      else -> MaterialTheme.colorScheme.onSurface
                                  }
                                  val hasEvent = events.any {
                                      java.time.Instant.ofEpochMilli(it.timeMs).atZone(ZoneId.systemDefault()).toLocalDate() == d
                                  }
                                  Column(
                                      Modifier.weight(1f).aspectRatio(1f).padding(2.dp)
                                          .clip(RoundedCornerShape(6.dp)).background(bg)
                                          .clickable { onSelect(d) }.padding(2.dp),
                                      horizontalAlignment = Alignment.CenterHorizontally,
                                      verticalArrangement = Arrangement.Center
                                  ) {
                                      Text("$dayNum", fontSize = 15.sp, fontWeight = FontWeight.Bold, color = fg)
                                      Text(Lunar.shortLabel(d), fontSize = 9.sp, color = fg, maxLines = 1)
                                      if (hasEvent) Box(Modifier.size(4.dp).clip(CircleShape).background(MaterialTheme.colorScheme.error))
                                  }
                              } else {
                                  Spacer(Modifier.weight(1f).aspectRatio(1f).padding(2.dp))
                              }
                          }
                      }
                  }
                  Spacer(Modifier.height(12.dp))
                  DayView(selected, events, onSelect)
              }
          }

          fun dayOfWeekShort(d: Int): String = when (d) { 1->"一";2->"二";3->"三";4->"四";5->"五";6->"六";else->"日" }

          @Composable
          fun AddEventDialog(onDismiss: () -> Unit, onConfirm: (String, Long) -> Unit, initialDate: LocalDate) {
              var title by remember { mutableStateOf("") }
              var date by remember { mutableStateOf(initialDate) }
              var hour by remember { mutableIntStateOf(9) }
              var minute by remember { mutableIntStateOf(0) }
              AlertDialog(
                  onDismissRequest = onDismiss,
                  title = { Text("添加日程") },
                  text = {
                      Column {
                          OutlinedTextField(title, { title = it }, label = { Text("标题") }, singleLine = true)
                          Spacer(Modifier.height(8.dp))
                          Row(verticalAlignment = Alignment.CenterVertically) {
                              Text("日期", modifier = Modifier.weight(1f)); Text(date.toString())
                          }
                          Row(horizontalArrangement = Arrangement.spacedBy(8.dp), modifier = Modifier.padding(vertical = 4.dp)) {
                              IconButton({ date = date.minusDays(1) }) { Text("−日") }
                              IconButton({ date = date.plusDays(1) }) { Text("+日") }
                          }
                          Row(verticalAlignment = Alignment.CenterVertically) {
                              Text("时", modifier = Modifier.weight(1f))
                              IconButton({ hour = (hour - 1 + 24) % 24 }) { Text("−") }
                              Text("$hour", Modifier.widthIn(min = 40.dp), textAlign = TextAlign.Center)
                              IconButton({ hour = (hour + 1) % 24 }) { Text("+") }
                          }
                          Row(verticalAlignment = Alignment.CenterVertically) {
                              Text("分", modifier = Modifier.weight(1f))
                              IconButton({ minute = (minute - 5 + 60) % 60 }) { Text("−5") }
                              Text("$minute", Modifier.widthIn(min = 40.dp), textAlign = TextAlign.Center)
                              IconButton({ minute = (minute + 5) % 60 }) { Text("+5") }
                          }
                      }
                  },
                  confirmButton = {
                      TextButton({
                          if (title.isNotBlank()) {
                              val dt = LocalDateTime.of(date, LocalTime.of(hour, minute))
                              onConfirm(title, dt.atZone(ZoneId.systemDefault()).toInstant().toEpochMilli())
                          }
                      }) { Text("保存") }
                  },
                  dismissButton = { TextButton(onDismiss) { Text("取消") } }
              )
          }
