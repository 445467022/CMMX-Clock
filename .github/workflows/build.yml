                              onDelete = { stages = stages.toMutableList().also { it.removeAt(i) }; Store.saveStages(ctx, stages) }
                          )
                      }
                      TextButton(
                          onClick = { stages = stages + Stage("阶段 ${stages.size + 1}", 5); Store.saveStages(ctx, stages) },
                          enabled = !running && stages.size < 30
                      ) { Text("+ 添加阶段") }

                      Row(Modifier.fillMaxWidth().padding(vertical = 8.dp), verticalAlignment = Alignment.CenterVertically) {
                          Text("循环重复", modifier = Modifier.weight(1f))
                          Switch(loopEnabled, { loopEnabled = it; Store.saveLoop(ctx, it) }, enabled = !running)
                      }

                      TextButton(onClick = { showSchedulePanel = !showSchedulePanel }, enabled = !running) {
                          Text(if (showSchedulePanel) "收起时间段生成" else "时间段生成循环表单")
                      }
                      if (showSchedulePanel) {
                          SchedulePanel(
                              dayStartText = dayStartText, dayEndText = dayEndText,
                              workMin = workMin, restMin = restMin, enabled = !running,
                              onDayStartText = { dayStartText = autoFormatTime(it) },
                              onDayEndText = { dayEndText = autoFormatTime(it) },
                              onWork = { workMin = it }, onRest = { restMin = it },
                              onGenerate = {
                                  val s = parseHm(dayStartText); val e = parseHm(dayEndText)
                                  if (s != null && e != null && s < e) {
                                      Store.saveDayStart(ctx, s); Store.saveDayEnd(ctx, e)
                                      val gen = generateSchedule(s, e, workMin, restMin)
                                      if (gen.isNotEmpty()) { stages = gen; Store.saveStages(ctx, gen) }
                                  }
                              }
                          )
                      }

                      Spacer(Modifier.height(8.dp))
                      Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {
                          Text("每天自动执行日程", modifier = Modifier.weight(1f))
                          Switch(scheduleEnabled, {
                              scheduleEnabled = it; Store.saveScheduleEnabled(ctx, it)
                              if (it) ScheduleReceiver.scheduleNext(ctx) else ScheduleReceiver.cancel(ctx)
                          })
                      }
                      if (scheduleEnabled) {
                          Row(verticalAlignment = Alignment.CenterVertically, modifier = Modifier.padding(top = 4.dp)) {
                              Text("每天开始时间", modifier = Modifier.weight(1f))
                              OutlinedTextField(
                                  value = scheduleStartText,
                                  onValueChange = {
                                      scheduleStartText = autoFormatTime(it)
                                      parseHm(scheduleStartText)?.let { m -> Store.saveScheduleStart(ctx, m) }
                                  },
                                  singleLine = true,
                                  keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number),
                                  modifier = Modifier.width(120.dp)
                              )
                          }
                          LaunchedEffect(scheduleStartText) {
                              parseHm(scheduleStartText)?.let { m ->
                                  if (Store.loadScheduleStart(ctx) != m) {
                                      Store.saveScheduleStart(ctx, m)
                                      if (scheduleEnabled) ScheduleReceiver.scheduleNext(ctx)
                                  }
                              }
                          }
                          Text("提示：每天 ${scheduleStartText} 自动启动循环表单",
                              style = MaterialTheme.typography.bodySmall,
                              color = MaterialTheme.colorScheme.onSurfaceVariant)
                      }
                  } else {
                      FreeTimePicker(freeMinutes, !running) { freeMinutes = it; Store.saveFree(ctx, it) }
                  }

                  Spacer(Modifier.height(24.dp))
              }
          }

          fun generateSchedule(startMin: Int, endMin: Int, workMin: Int, restMin: Int): List<Stage> {
              if (startMin >= endMin || workMin < 1 || restMin < 1) return emptyList()
              val out = mutableListOf<Stage>()
              var cur = startMin
              while (cur < endMin) {
                  val we = minOf(cur + workMin, endMin)
                  out += Stage("工作", we - cur, cur)
                  cur = we
                  if (cur >= endMin) break
                  val re = minOf(cur + restMin, endMin)
                  out += Stage("休息", re - cur, cur)
                  cur = re
              }
              return out
          }

