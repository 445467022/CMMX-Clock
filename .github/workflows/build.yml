name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate project files
        run: |
          mkdir -p app/src/main/java/com/example/looptimer
          mkdir -p app/src/main/res/values

          cat > gradle.properties <<'GF_EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          kotlin.code.style=official
          GF_EOF

          cat > settings.gradle.kts <<'SG_EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "LoopTimer"
          include(":app")
          SG_EOF

          cat > build.gradle.kts <<'BG_EOF'
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          BG_EOF

          cat > app/build.gradle.kts <<'AB_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.looptimer"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.looptimer"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 2
                  versionName = "2.0"
              }
              buildTypes { release { isMinifyEnabled = false } }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.8" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation(platform("androidx.compose:compose-bom:2024.02.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-core")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
              debugImplementation("androidx.compose.ui:ui-tooling")
          }
          AB_EOF

          cat > app/src/main/AndroidManifest.xml <<'MF_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.USE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />

              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="循环提醒"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.LoopTimer">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:label="循环提醒">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".TimerService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="Interval timer and countdown reminder" />
                  </service>

                  <receiver
                      android:name=".ReminderReceiver"
                      android:exported="false" />
              </application>
          </manifest>
          MF_EOF

          cat > app/src/main/res/values/themes.xml <<'TH_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.LoopTimer" parent="android:Theme.Material.Light.NoActionBar" />
          </resources>
          TH_EOF

          cat > app/src/main/java/com/example/looptimer/Store.kt <<'ST_EOF'
          package com.example.looptimer

          import android.content.Context
          import org.json.JSONArray
          import org.json.JSONObject

          data class Stage(val name: String, val minutes: Int, val startMin: Int = -1)
          data class Todo(val id: Long, val text: String, val done: Boolean, val remindAt: Long = 0L)
          data class CalEvent(val id: Long, val title: String, val timeMs: Long, val note: String = "")

          object Store {
              private const val PREF = "loop_timer"
              private fun sp(c: Context) = c.getSharedPreferences(PREF, Context.MODE_PRIVATE)

              fun loadStages(c: Context): List<Stage> {
                  val raw = sp(c).getString("stages", null) ?: return defaultStages()
                  return try {
                      val a = JSONArray(raw)
                      List(a.length()) { i ->
                          val o = a.getJSONObject(i)
                          Stage(o.optString("name", "阶段"), o.optInt("minutes", 5).coerceIn(1, 999), o.optInt("startMin", -1))
                      }
                  } catch (e: Exception) { defaultStages() }
              }
              fun saveStages(c: Context, l: List<Stage>) {
                  val a = JSONArray()
                  l.forEach { a.put(JSONObject().put("name", it.name).put("minutes", it.minutes).put("startMin", it.startMin)) }
                  sp(c).edit().putString("stages", a.toString()).apply()
              }
              private fun defaultStages() = listOf(Stage("工作", 30), Stage("休息", 5))

              fun loadLoop(c: Context) = sp(c).getBoolean("loop", true)
              fun saveLoop(c: Context, v: Boolean) = sp(c).edit().putBoolean("loop", v).apply()
              fun loadMode(c: Context) = sp(c).getInt("mode", 0)
              fun saveMode(c: Context, v: Int) = sp(c).edit().putInt("mode", v).apply()
              fun loadFree(c: Context) = sp(c).getInt("free", 25)
              fun saveFree(c: Context, v: Int) = sp(c).edit().putInt("free", v).apply()

              fun loadSound(c: Context) = sp(c).getBoolean("sound", true)
              fun saveSound(c: Context, v: Boolean) = sp(c).edit().putBoolean("sound", v).apply()
              fun loadVibrate(c: Context) = sp(c).getBoolean("vibrate", true)
              fun saveVibrate(c: Context, v: Boolean) = sp(c).edit().putBoolean("vibrate", v).apply()

              fun loadDayStart(c: Context) = sp(c).getInt("dayStart", 8 * 60)
              fun saveDayStart(c: Context, v: Int) = sp(c).edit().putInt("dayStart", v).apply()
              fun loadDayEnd(c: Context) = sp(c).getInt("dayEnd", 18 * 60)
              fun saveDayEnd(c: Context, v: Int) = sp(c).edit().putInt("dayEnd", v).apply()

              fun loadTodos(c: Context): List<Todo> {
                  val raw = sp(c).getString("todos", null) ?: return emptyList()
                  return try {
                      val a = JSONArray(raw)
                      List(a.length()) { i ->
                          val o = a.getJSONObject(i)
                          Todo(o.optLong("id"), o.optString("text"), o.optBoolean("done"), o.optLong("remindAt", 0L))
                      }
                  } catch (e: Exception) { emptyList() }
              }
              fun saveTodos(c: Context, l: List<Todo>) {
                  val a = JSONArray()
                  l.forEach {
                      a.put(JSONObject().put("id", it.id).put("text", it.text).put("done", it.done).put("remindAt", it.remindAt))
                  }
                  sp(c).edit().putString("todos", a.toString()).apply()
              }

              fun loadEvents(c: Context): List<CalEvent> {
                  val raw = sp(c).getString("events", null) ?: return emptyList()
                  return try {
                      val a = JSONArray(raw)
                      List(a.length()) { i ->
                          val o = a.getJSONObject(i)
                          CalEvent(o.optLong("id"), o.optString("title"), o.optLong("timeMs"), o.optString("note"))
                      }
                  } catch (e: Exception) { emptyList() }
              }
              fun saveEvents(c: Context, l: List<CalEvent>) {
                  val a = JSONArray()
                  l.forEach { a.put(JSONObject().put("id", it.id).put("title", it.title).put("timeMs", it.timeMs).put("note", it.note)) }
                  sp(c).edit().putString("events", a.toString()).apply()
              }
          }

          fun formatMs(ms: Long): String {
              val sec = (ms.coerceAtLeast(0) + 999) / 1000
              return "%02d:%02d".format(sec / 60, sec % 60)
          }

          fun formatHm(minutesOfDay: Int): String = "%02d:%02d".format(minutesOfDay / 60, minutesOfDay % 60)
          ST_EOF

          cat > app/src/main/java/com/example/looptimer/Lunar.kt <<'LU_EOF'
          package com.example.looptimer

          import java.time.LocalDate
          import java.time.temporal.ChronoUnit

          data class LunarDate(val year: Int, val month: Int, val day: Int, val isLeap: Boolean)

          object Lunar {
              private val lunarInfo = longArrayOf(
                  0x04bd8,0x04ae0,0x0a570,0x054d5,0x0d260,0x0d950,0x16554,0x056a0,0x09ad0,0x055d2,
                  0x04ae0,0x0a5b6,0x0a4d0,0x0d250,0x1d255,0x0b540,0x0d6a0,0x0ada2,0x095b0,0x14977,
                  0x04970,0x0a4b0,0x0b4b5,0x06a50,0x06d40,0x1ab54,0x02b60,0x09570,0x052f2,0x04970,
                  0x06566,0x0d4a0,0x0ea50,0x06e95,0x05ad0,0x02b60,0x186e3,0x092e0,0x1c8d7,0x0c950,
                  0x0d4a0,0x1d8a6,0x0b550,0x056a0,0x1a5b4,0x025d0,0x092d0,0x0d2b2,0x0a950,0x0b557,
                  0x06ca0,0x0b550,0x15355,0x04da0,0x0a5b0,0x14573,0x052b0,0x0a9a8,0x0e950,0x06aa0,
                  0x0aea6,0x0ab50,0x04b60,0x0aae4,0x0a570,0x05260,0x0f263,0x0d950,0x05b57,0x056a0,
                  0x096d0,0x04dd5,0x04ad0,0x0a4d0,0x0d4d4,0x0d250,0x0d558,0x0b540,0x0b6a0,0x195a6,
                  0x095b0,0x049b0,0x0a974,0x0a4b0,0x0b27a,0x06a50,0x06d40,0x0af46,0x0ab60,0x09570,
                  0x04af5,0x04970,0x064b0,0x074a3,0x0ea50,0x06b58,0x055c0,0x0ab60,0x096d5,0x092e0,
                  0x0c960,0x0d954,0x0d4a0,0x0da50,0x07552,0x056a0,0x0abb7,0x025d0,0x092d0,0x0cab5,
                  0x0a950,0x0b4a0,0x0baa4,0x0ad50,0x055d9,0x04ba0,0x0a5b0,0x15176,0x052b0,0x0a930,
                  0x07954,0x06aa0,0x0ad50,0x05b52,0x04b60,0x0a6e6,0x0a4e0,0x0d260,0x0ea65,0x0d530,
                  0x05aa0,0x076a3,0x096d0,0x04afb,0x04ad0,0x0a4d0,0x1d0b6,0x0d250,0x0d520,0x0dd45,
                  0x0b5a0,0x056d0,0x055b2,0x049b0,0x0a577,0x0a4b0,0x0aa50,0x1b255,0x06d20,0x0ada0,
                  0x14b63,0x09370,0x049f8,0x04970,0x064b0,0x168a6,0x0ea50,0x06b20,0x1a6c4,0x0aae0,
                  0x092e0,0x0d2e3,0x0c960,0x0d557,0x0d4a0,0x0da50,0x05d55,0x056a0,0x0a6d0,0x055d4,
                  0x052d0,0x0a9b8,0x0a950,0x0b4a0,0x0b6a6,0x0ad50,0x055a0,0x0aba4,0x0a5b0,0x052b0,
                  0x0b273,0x06930,0x07337,0x06aa0,0x0ad50,0x14b55,0x04b60,0x0a570,0x054e4,0x0d160,
                  0x0e968,0x0d520,0x0daa0,0x16aa6,0x056d0,0x04ae0,0x0a9d4,0x0a2d0,0x0d150,0x0f252,
                  0x0d520
              )

              private fun yearDays(y: Int): Int {
                  var sum = 348
                  var i = 0x8000
                  while (i > 0x8) {
                      if (lunarInfo[y - 1900] and i.toLong() != 0L) sum++
                      i = i shr 1
                  }
                  return sum + leapDays(y)
              }
              private fun leapMonth(y: Int): Int = (lunarInfo[y - 1900] and 0xf).toInt()
              private fun leapDays(y: Int): Int {
                  if (leapMonth(y) == 0) return 0
                  return if (lunarInfo[y - 1900] and 0x10000L != 0L) 30 else 29
              }
              private fun monthDays(y: Int, m: Int): Int =
                  if (lunarInfo[y - 1900] and (0x10000L shr m) != 0L) 30 else 29

              fun fromSolar(date: LocalDate): LunarDate {
                  val base = LocalDate.of(1900, 1, 31)
                  val offset = ChronoUnit.DAYS.between(base, date).toInt()
                  if (offset < 0) return LunarDate(date.year, date.monthValue, date.dayOfMonth, false)

                  var remain = offset
                  var year = 1900
                  while (year < 2100) {
                      val yd = yearDays(year)
                      if (remain < yd) break
                      remain -= yd
                      year++
                  }

                  val leap = leapMonth(year)
                  var isLeap = false
                  var month = 1
                  while (month <= 12) {
                      val md: Int
                      if (leap > 0 && month == leap + 1 && !isLeap) {
                          md = leapDays(year)
                          isLeap = true
                          month--
                      } else {
                          md = monthDays(year, month)
                      }
                      if (remain < md) break
                      remain -= md
                      if (isLeap && month == leap + 1) isLeap = false
                      month++
                  }
                  return LunarDate(year, month, remain + 1, isLeap)
              }

              private val dayNames = arrayOf(
                  "初一","初二","初三","初四","初五","初六","初七","初八","初九","初十",
                  "十一","十二","十三","十四","十五","十六","十七","十八","十九","二十",
                  "廿一","廿二","廿三","廿四","廿五","廿六","廿七","廿八","廿九","三十"
              )
              private val monthNames = arrayOf(
                  "正","二","三","四","五","六","七","八","九","十","冬","腊"
              )

              fun dayName(d: Int): String = if (d in 1..30) dayNames[d - 1] else ""
              fun monthName(m: Int, leap: Boolean): String {
                  val base = if (m in 1..12) monthNames[m - 1] + "月" else ""
                  return if (leap) "闰$base" else base
              }

              fun shortLabel(date: LocalDate): String {
                  val lunar = fromSolar(date)
                  val special = specialOf(date)
                  if (special != null) return special
                  val holiday = legalHoliday(date)
                  if (holiday != null) return holiday
                  if (lunar.day == 1) return monthName(lunar.month, lunar.isLeap)
                  return dayName(lunar.day)
              }

              fun lunarText(date: LocalDate): String {
                  val l = fromSolar(date)
                  return "${l.year}年${monthName(l.month, l.isLeap)}${dayName(l.day)}"
              }

              fun specialOf(d: LocalDate): String? {
                  val md = d.monthValue * 100 + d.dayOfMonth
                  return when (md) {
                      214 -> "情人节"
                      308 -> "妇女节"
                      312 -> "植树节"
                      315 -> "消费者日"
                      401 -> "愚人节"
                      501 -> "劳动节"
                      504 -> "青年节"
                      520 -> "表白日"
                      521 -> "表白日"
                      525 -> "心理健康节"
                      601 -> "儿童节"
                      701 -> "建党节"
                      801 -> "建军节"
                      910 -> "教师节"
                      1001 -> "国庆节"
                      1024 -> "程序员节"
                      1108 -> "记者节"
                      1111 -> "双十一"
                      1213 -> "公祭日"
                      1224 -> "平安夜"
                      1225 -> "圣诞节"
                      else -> null
                  }
              }

              fun legalHoliday(d: LocalDate): String? {
                  val md = d.monthValue * 100 + d.dayOfMonth
                  return when (md) {
                      101 -> "元旦"
                      501 -> "劳动节"
                      1001,1002,1003 -> "国庆"
                      else -> null
                  }
              }
          }
          LU_EOF

          cat > app/src/main/java/com/example/looptimer/ReminderReceiver.kt <<'RR_EOF'
          package com.example.looptimer

          import android.Manifest
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.media.AudioAttributes
          import android.media.Ringtone
          import android.media.RingtoneManager
          import android.os.Build
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.os.VibratorManager
          import androidx.core.app.NotificationCompat
          import androidx.core.app.NotificationManagerCompat
          import androidx.core.content.ContextCompat

          class ReminderReceiver : BroadcastReceiver() {
              override fun onReceive(ctx: Context, intent: Intent) {
                  val id = intent.getIntExtra("id", 1)
                  val title = intent.getStringExtra("title") ?: "提醒"
                  val channel = "reminder_channel"
                  val mgr = ctx.getSystemService(NotificationManager::class.java)
                  if (mgr.getNotificationChannel(channel) == null) {
                      mgr.createNotificationChannel(
                          NotificationChannel(channel, "待办提醒", NotificationManager.IMPORTANCE_HIGH).apply {
                              setSound(null, null)
                          }
                      )
                  }

                  val pi = PendingIntent.getActivity(
                      ctx, id,
                      Intent(ctx, MainActivity::class.java).apply { flags = Intent.FLAG_ACTIVITY_SINGLE_TOP },
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )

                  val n = NotificationCompat.Builder(ctx, channel)
                      .setSmallIcon(android.R.drawable.ic_lock_idle_alarm)
                      .setContentTitle("⏰ $title")
                      .setContentText("时间到了！")
                      .setContentIntent(pi)
                      .setAutoCancel(true)
                      .setPriority(NotificationCompat.PRIORITY_HIGH)
                      .setSilent(true)
                      .build()

                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.TIRAMISU ||
                      ContextCompat.checkSelfPermission(ctx, Manifest.permission.POST_NOTIFICATIONS) == PackageManager.PERMISSION_GRANTED) {
                      NotificationManagerCompat.from(ctx).notify(id, n)
                  }

                  try {
                      val uri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION)
                      val rt = RingtoneManager.getRingtone(ctx, uri)?.apply {
                          audioAttributes = AudioAttributes.Builder()
                              .setUsage(AudioAttributes.USAGE_NOTIFICATION)
                              .build()
                          play()
                      }
                  } catch (e: Exception) {}

                  try {
                      val pattern = longArrayOf(0, 500, 300, 500)
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                          ctx.getSystemService(VibratorManager::class.java)?.defaultVibrator
                              ?.vibrate(VibrationEffect.createWaveform(pattern, -1))
                      } else {
                          @Suppress("DEPRECATION")
                          ctx.getSystemService(Vibrator::class.java)
                              ?.vibrate(VibrationEffect.createWaveform(pattern, -1))
                      }
                  } catch (e: Exception) {}
              }
          }
          RR_EOF

          cat > app/src/main/java/com/example/looptimer/TimerService.kt <<'TS_EOF'
          package com.example.looptimer

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.media.AudioAttributes
          import android.media.Ringtone
          import android.media.RingtoneManager
          import android.os.Build
          import android.os.IBinder
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.os.VibratorManager
          import androidx.core.app.NotificationCompat
          import androidx.core.app.NotificationManagerCompat
          import androidx.core.content.ContextCompat
          import kotlinx.coroutines.*
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.asStateFlow
          import org.json.JSONArray
          import org.json.JSONObject

          data class TimerUiState(
              val running: Boolean = false,
              val paused: Boolean = false,
              val stageName: String = "",
              val stageIndex: Int = 0,
              val stageCount: Int = 0,
              val remainingMs: Long = 0L,
              val stageDurationMs: Long = 0L,
              val loop: Boolean = false,
              val finished: Boolean = false
          )

          class TimerService : Service() {
              companion object {
                  const val A_START = "looptimer.action.START"
                  const val A_PAUSE = "looptimer.action.PAUSE"
                  const val A_RESUME = "looptimer.action.RESUME"
                  const val A_SKIP = "looptimer.action.SKIP"
                  const val A_STOP = "looptimer.action.STOP"
                  const val EXTRA_STAGES = "stages"
                  const val EXTRA_LOOP = "loop"
                  private const val CH = "loop_timer_channel"
                  private const val ONGOING_ID = 1001

                  private val _state = MutableStateFlow(TimerUiState())
                  val state = _state.asStateFlow()

                  fun start(ctx: Context, stages: List<Stage>, loop: Boolean) {
                      val i = Intent(ctx, TimerService::class.java).apply {
                          action = A_START
                          putExtra(EXTRA_STAGES, encode(stages))
                          putExtra(EXTRA_LOOP, loop)
                      }
                      ContextCompat.startForegroundService(ctx, i)
                  }
                  fun pause(ctx: Context) = send(ctx, A_PAUSE)
                  fun resume(ctx: Context) = send(ctx, A_RESUME)
                  fun skip(ctx: Context) = send(ctx, A_SKIP)
                  fun stop(ctx: Context) = send(ctx, A_STOP)
                  private fun send(ctx: Context, a: String) {
                      ContextCompat.startForegroundService(ctx, Intent(ctx, TimerService::class.java).setAction(a))
                  }
                  private fun encode(l: List<Stage>): String {
                      val a = JSONArray()
                      l.forEach { a.put(JSONObject().put("name", it.name).put("minutes", it.minutes).put("startMin", it.startMin)) }
                      return a.toString()
                  }
                  private fun decode(raw: String?): List<Stage> {
                      if (raw.isNullOrBlank()) return emptyList()
                      return try {
                          val a = JSONArray(raw)
                          List(a.length()) { i ->
                              val o = a.getJSONObject(i)
                              Stage(o.optString("name"), o.optInt("minutes", 5).coerceIn(1, 999), o.optInt("startMin", -1))
                          }
                      } catch (e: Exception) { emptyList() }
                  }
              }

              private val scope = CoroutineScope(SupervisorJob() + Dispatchers.Main.immediate)
              private var stages: List<Stage> = emptyList()
              private var loop: Boolean = false
              private var index = 0
              private var endTime: Long = 0L
              private var pausedRemaining: Long = 0L
              private var paused = false
              private var running = false
              private var tickerJob: Job? = null
              private var ringtone: Ringtone? = null
              private var lastNotif = 0L
              private var soundEnabled = true
              private var vibrateEnabled = true

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  createChannel()
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  soundEnabled = Store.loadSound(this)
                  vibrateEnabled = Store.loadVibrate(this)
                  when (intent?.action) {
                      A_START -> {
                          val list = decode(intent.getStringExtra(EXTRA_STAGES))
                          if (list.isEmpty()) { stopSelf(); return START_NOT_STICKY }
                          stages = list
                          loop = intent.getBooleanExtra(EXTRA_LOOP, false)
                          startForegroundCompat()
                          running = true; paused = false; index = 0
                          startStage(0)
                      }
                      A_PAUSE -> if (running) doPause() else stopSelf()
                      A_RESUME -> if (running) doResume() else stopSelf()
                      A_SKIP -> if (running) skip() else stopSelf()
                      A_STOP -> stopEverything()
                  }
                  return START_NOT_STICKY
              }

              override fun onDestroy() {
                  tickerJob?.cancel(); ringtone?.stop(); scope.cancel()
                  super.onDestroy()
              }

              private fun startStage(i: Int) {
                  index = i
                  val dur = (stages.getOrNull(i)?.minutes ?: 1) * 60_000L
                  endTime = System.currentTimeMillis() + dur
                  pausedRemaining = dur
                  paused = false
                  emitState(dur); notifyOngoing(); startTicker()
              }
              private fun doPause() {
                  if (paused) return
                  pausedRemaining = (endTime - System.currentTimeMillis()).coerceAtLeast(0)
                  paused = true
                  emitState(pausedRemaining); notifyOngoing()
              }
              private fun doResume() {
                  if (!paused) return
                  endTime = System.currentTimeMillis() + pausedRemaining
                  paused = false
                  emitState(pausedRemaining); notifyOngoing()
              }
              private fun skip() {
                  val n = index + 1
                  when {
                      n < stages.size -> startStage(n)
                      loop -> startStage(0)
                      else -> finishAll()
                  }
              }
              private fun stageFinished() { playAlarm(); skip() }
              private fun finishAll() {
                  running = false; paused = false; tickerJob?.cancel(); tickerJob = null
                  _state.value = TimerUiState(finished = true)
                  stopForeground(STOP_FOREGROUND_REMOVE); stopSelf()
              }
              private fun stopEverything() {
                  running = false; paused = false; tickerJob?.cancel(); tickerJob = null
                  ringtone?.stop(); ringtone = null
                  _state.value = TimerUiState()
                  stopForeground(STOP_FOREGROUND_REMOVE); stopSelf()
              }
              private fun startTicker() {
                  if (tickerJob?.isActive == true) return
                  tickerJob = scope.launch {
                      while (isActive) {
                          if (running) {
                              if (paused) emitState(pausedRemaining)
                              else {
                                  val r = (endTime - System.currentTimeMillis()).coerceAtLeast(0)
                                  if (r <= 0) stageFinished()
                                  else { emitState(r); maybeUpdateNotif() }
                              }
                          }
                          delay(200)
                      }
                  }
              }
              private fun emitState(remaining: Long) {
                  val st = stages.getOrNull(index)
                  _state.value = TimerUiState(
                      running = running, paused = paused,
                      stageName = st?.name ?: "", stageIndex = index, stageCount = stages.size,
                      remainingMs = remaining, stageDurationMs = (st?.minutes ?: 0) * 60_000L,
                      loop = loop
                  )
              }
              private fun playAlarm() {
                  if (soundEnabled) {
                      try {
                          ringtone?.stop()
                          val uri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_ALARM)
                              ?: RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION)
                          ringtone = RingtoneManager.getRingtone(applicationContext, uri)?.apply {
                              audioAttributes = AudioAttributes.Builder()
                                  .setUsage(AudioAttributes.USAGE_ALARM).build()
                              play()
                          }
                          scope.launch { delay(10_000); ringtone?.stop(); ringtone = null }
                      } catch (e: Exception) {}
                  }
                  if (vibrateEnabled) {
                      try {
                          val pattern = longArrayOf(0, 500, 300, 500, 300, 500)
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                              getSystemService(VibratorManager::class.java)?.defaultVibrator
                                  ?.vibrate(VibrationEffect.createWaveform(pattern, -1))
                          } else {
                              @Suppress("DEPRECATION")
                              getSystemService(Vibrator::class.java)
                                  ?.vibrate(VibrationEffect.createWaveform(pattern, -1))
                          }
                      } catch (e: Exception) {}
                  }
              }
              private fun createChannel() {
                  val mgr = getSystemService(NotificationManager::class.java)
                  if (mgr.getNotificationChannel(CH) == null) {
                      val ch = NotificationChannel(CH, "计时通知", NotificationManager.IMPORTANCE_LOW).apply {
                          setSound(null, null); enableVibration(false)
                      }
                      mgr.createNotificationChannel(ch)
                  }
              }
              private fun startForegroundCompat() {
                  val n = buildOngoing()
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.UPSIDE_DOWN_CAKE) {
                      startForeground(ONGOING_ID, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE)
                  } else {
                      startForeground(ONGOING_ID, n)
                  }
              }
              private fun notifyOngoing() {
                  NotificationManagerCompat.from(this).notify(ONGOING_ID, buildOngoing())
              }
              private fun maybeUpdateNotif() {
                  val now = System.currentTimeMillis()
                  if (now - lastNotif >= 900) { lastNotif = now; notifyOngoing() }
              }
              private fun contentPi(): PendingIntent {
                  val i = Intent(this, MainActivity::class.java).apply {
                      flags = Intent.FLAG_ACTIVITY_SINGLE_TOP or Intent.FLAG_ACTIVITY_CLEAR_TOP
                  }
                  return PendingIntent.getActivity(this, 0, i, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
              }
              private fun buildOngoing(): Notification {
                  val st = stages.getOrNull(index)
                  val r = if (paused) pausedRemaining else (endTime - System.currentTimeMillis()).coerceAtLeast(0)
                  val title = when {
                      paused -> "已暂停 · ${st?.name ?: ""}"
                      st != null -> "${st.name} · ${formatMs(r)}"
                      else -> "计时"
                  }
                  return NotificationCompat.Builder(this, CH)
                      .setSmallIcon(android.R.drawable.ic_lock_idle_alarm)
                      .setContentTitle(title)
                      .setContentText("第 ${index + 1}/${stages.size} 段")
                      .setContentIntent(contentPi())
                      .setOngoing(true).setOnlyAlertOnce(true).setSilent(true)
                      .setPriority(NotificationCompat.PRIORITY_LOW)
                      .setCategory(NotificationCompat.CATEGORY_STOPWATCH)
                      .build()
              }
          }
