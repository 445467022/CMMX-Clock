          cat > app/src/main/java/com/example/looptimer/TimerService.kt <<'TS_EOF'
          package com.example.looptimer

          import android.app.AlarmManager
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.media.AudioAttributes
          import android.media.AudioManager
          import android.media.MediaPlayer
          import android.media.Ringtone
          import android.media.RingtoneManager
          import android.os.Build
          import android.os.IBinder
          import android.os.PowerManager
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.os.VibratorManager
          import androidx.core.app.NotificationCompat
          import androidx.core.app.NotificationManagerCompat
          import androidx.core.content.ContextCompat
          import kotlinx.coroutines.*
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.asStateFlow
          import org.json.JSONArray
          import org.json.JSONObject
          import java.time.Duration
          import java.time.LocalDateTime
          import java.time.LocalTime

          data class TimerUiState(
              val running: Boolean = false, val paused: Boolean = false, val waiting: Boolean = false,
              val ringing: Boolean = false, val stageName: String = "", val nextStageName: String = "",
              val stageIndex: Int = 0, val stageCount: Int = 0, val remainingMs: Long = 0L,
              val stageDurationMs: Long = 0L, val loop: Boolean = false, val finished: Boolean = false
          )

          class TimerService : Service() {
              companion object {
                  const val A_START = "looptimer.action.START"
                  const val A_PAUSE = "looptimer.action.PAUSE"
                  const val A_RESUME = "looptimer.action.RESUME"
                  const val A_SKIP = "looptimer.action.SKIP"
                  const val A_STOP = "looptimer.action.STOP"
                  const val A_STOP_RING = "looptimer.action.STOP_RING"
                  const val A_FORCE_TICK = "looptimer.action.FORCE_TICK"
                  const val A_ADJUST = "looptimer.action.ADJUST"
                  const val EXTRA_STAGES = "stages"
                  const val EXTRA_LOOP = "loop"
                  const val EXTRA_DELTA = "delta_ms"
                  private const val CH = "loop_timer_channel_v2"
                  private const val RING_CH = "loop_timer_ring_v2"
                  private const val ONGOING_ID = 1001
                  private const val RING_ID = 2003
                  private val _state = MutableStateFlow(TimerUiState())
                  val state = _state.asStateFlow()

                  fun start(ctx: Context, stages: List<Stage>, loop: Boolean) {
                      ContextCompat.startForegroundService(ctx, Intent(ctx, TimerService::class.java).apply {
                          action = A_START; putExtra(EXTRA_STAGES, encode(stages)); putExtra(EXTRA_LOOP, loop)
                      })
                  }
                  fun pause(ctx: Context) = send(ctx, A_PAUSE)
                  fun resume(ctx: Context) = send(ctx, A_RESUME)
                  fun skip(ctx: Context) = send(ctx, A_SKIP)
                  fun stop(ctx: Context) = send(ctx, A_STOP)
                  fun stopRing(ctx: Context) = send(ctx, A_STOP_RING)
                  fun adjust(ctx: Context, deltaMs: Long) {
                      ContextCompat.startForegroundService(ctx, Intent(ctx, TimerService::class.java).apply {
                          action = A_ADJUST; putExtra(EXTRA_DELTA, deltaMs)
                      })
                  }
                  private fun send(ctx: Context, a: String) {
                      ContextCompat.startForegroundService(ctx, Intent(ctx, TimerService::class.java).setAction(a))
                  }
                  private fun encode(l: List<Stage>): String {
                      val a = JSONArray()
                      l.forEach { a.put(JSONObject().put("name", it.name).put("minutes", it.minutes).put("startMin", it.startMin)) }
                      return a.toString()
                  }
                  private fun decode(raw: String?): List<Stage> {
                      if (raw.isNullOrBlank()) return emptyList()
                      return try {
                          val a = JSONArray(raw)
                          List(a.length()) { i ->
                              val o = a.getJSONObject(i)
                              Stage(o.optString("name"), o.optInt("minutes", 5).coerceIn(1, 999), o.optInt("startMin", -1))
                          }
                      } catch (e: Exception) { emptyList() }
                  }
              }
              private val scope = CoroutineScope(SupervisorJob() + Dispatchers.Main.immediate)
              private var stages: List<Stage> = emptyList()
              private var loop = false
              private var index = 0
              private var endTime: Long = 0L
              private var pausedRemaining: Long = 0L
              private var paused = false
              private var waiting = false
              private var pendingIndex = -1
              private var nextStartAtMs = 0L
              private var running = false
              private var tickerJob: Job? = null
              private var mediaPlayer: MediaPlayer? = null
              private var ringtone: Ringtone? = null
              private var ringStopJob: Job? = null
              private var wakeLock: PowerManager.WakeLock? = null
              private var lastNotif = 0L
              private var soundEnabled = true
              private var vibrateEnabled = true
              private var notificationEnabled = true
              private var ringtoneType = 0
              private var ringDurationSec = 30

              override fun onBind(intent: Intent?): IBinder? = null
              override fun onCreate() { super.onCreate(); createChannels() }
              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  soundEnabled = Store.loadSound(this)
                  vibrateEnabled = Store.loadVibrate(this)
                  notificationEnabled = Store.loadNotification(this)
                  ringtoneType = Store.loadRingtoneType(this)
                  ringDurationSec = Store.loadRingDuration(this)
                  when (intent?.action) {
                      A_START -> {
                          val list = decode(intent.getStringExtra(EXTRA_STAGES))
                          if (list.isEmpty()) { stopSelf(); return START_NOT_STICKY }
                          stages = list; loop = intent.getBooleanExtra(EXTRA_LOOP, false)
                          startForegroundCompat(); startNewSession()
                      }
                      A_PAUSE -> if (running) doPause() else stopSelf()
                      A_RESUME -> if (running) doResume() else stopSelf()
                      A_SKIP -> if (running) skip() else stopSelf()
                      A_STOP -> stopEverything()
                      A_STOP_RING -> stopRingtone()
                      A_ADJUST -> {
                          val delta = intent.getLongExtra(EXTRA_DELTA, 0L)
                          if (running && delta != 0L) adjustTime(delta)
                      }
                      A_FORCE_TICK -> {
                          if (running) {
                              if (waiting) {
                                  if (System.currentTimeMillis() >= nextStartAtMs) { waiting = false; cancelStageAlarm(); startStage(pendingIndex, 0L) }
                              } else if (!paused) {
                                  val r = (endTime - System.currentTimeMillis()).coerceAtLeast(0)
                                  if (r <= 0) stageFinished()
                              }
                          } else stopSelf()
                      }
                  }
                  return START_NOT_STICKY
              }
              override fun onDestroy() {
                  tickerJob?.cancel()
                  try { mediaPlayer?.stop(); mediaPlayer?.release() } catch (e: Exception) {}
                  mediaPlayer = null
                  try { ringtone?.stop() } catch (e: Exception) {}
                  scope.cancel(); super.onDestroy()
              }

              private fun adjustTime(deltaMs: Long) {
                  if (waiting) {
                      nextStartAtMs += deltaMs
                      if (nextStartAtMs < System.currentTimeMillis() + 1000L) nextStartAtMs = System.currentTimeMillis() + 1000L
                      setStageAlarm(nextStartAtMs)
                  } else if (paused) {
                      pausedRemaining = (pausedRemaining + deltaMs).coerceAtLeast(1000L)
                  } else {
                      endTime = (endTime + deltaMs).coerceAtLeast(System.currentTimeMillis() + 1000L)
                      setStageAlarm(endTime)
                  }
                  emitState(if (waiting) (nextStartAtMs - System.currentTimeMillis()).coerceAtLeast(0)
                            else if (paused) pausedRemaining
                            else (endTime - System.currentTimeMillis()).coerceAtLeast(0))
                  notifyOngoing()
              }

              private fun startNewSession() {
                  running = true; paused = false; waiting = false
                  if (stages.any { it.startMin >= 0 }) {
                      val nowMin = LocalTime.now().let { it.hour * 60 + it.minute }
                      var idx = -1; var elapsedMs = 0L
                      for (i in stages.indices) {
                          val s = stages[i]
                          if (s.startMin < 0) continue
                          if (nowMin >= s.startMin && nowMin < s.startMin + s.minutes) { idx = i; elapsedMs = (nowMin - s.startMin) * 60_000L; break }
                      }
                      if (idx < 0) {
                          val future = stages.indices.filter { stages[it].startMin >= 0 && stages[it].startMin > nowMin }.minByOrNull { stages[it].startMin }
                          if (future != null) startWaiting(future, stages[future]) else startStage(0, 0L)
                      } else startStage(idx, elapsedMs)
                  } else startStage(0, 0L)
              }
              private fun startStage(i: Int, elapsedMs: Long = 0L) {
                  index = i
                  val totalDur = (stages.getOrNull(i)?.minutes ?: 1) * 60_000L
                  val dur = (totalDur - elapsedMs).coerceAtLeast(1_000L)
                  endTime = System.currentTimeMillis() + dur; pausedRemaining = dur
                  paused = false; waiting = false; pendingIndex = -1
                  emitState(dur); notifyOngoing(); startTicker(); setStageAlarm(endTime)
              }
              private fun startWaiting(nextIdx: Int, nextStage: Stage) {
                  waiting = true; paused = false; pendingIndex = nextIdx
                  val gap = computeGap(nextStage)
                  nextStartAtMs = System.currentTimeMillis() + gap
                  emitState(gap); notifyOngoing(); setStageAlarm(nextStartAtMs)
              }
              private fun computeGap(next: Stage): Long {
                  if (next.startMin < 0) return 0L
                  val now = LocalDateTime.now()
                  var target = now.toLocalDate().atTime(next.startMin / 60, next.startMin % 60)
                  if (!target.isAfter(now.plusSeconds(2))) target = target.plusDays(1)
                  return Duration.between(now, target).toMillis().coerceAtLeast(0)
              }
              private fun doPause() {
                  if (paused) return
                  if (waiting) {
                      cancelStageAlarm(); pausedRemaining = (nextStartAtMs - System.currentTimeMillis()).coerceAtLeast(0)
                      paused = true; emitState(pausedRemaining); notifyOngoing(); return
                  }
                  pausedRemaining = (endTime - System.currentTimeMillis()).coerceAtLeast(0)
                  paused = true; cancelStageAlarm(); emitState(pausedRemaining); notifyOngoing()
              }
              private fun doResume() {
                  if (!paused) return
                  paused = false
                  if (waiting) { nextStartAtMs = System.currentTimeMillis() + pausedRemaining; emitState(pausedRemaining); notifyOngoing(); setStageAlarm(nextStartAtMs) }
                  else { endTime = System.currentTimeMillis() + pausedRemaining; emitState(pausedRemaining); notifyOngoing(); setStageAlarm(endTime) }
              }
              private fun skip() {
                  if (waiting) { cancelStageAlarm(); waiting = false; paused = false; startStage(pendingIndex, 0L); return }
                  val n = index + 1
                  when { n < stages.size -> startStage(n, 0L); loop -> startStage(0, 0L); else -> finishAll() }
              }
              private fun stageFinished() {
                  cancelStageAlarm(); playAlarm()
                  val nextIdx = when { index + 1 < stages.size -> index + 1; loop -> 0; else -> -1 }
                  if (nextIdx < 0) { finishAll(); return }
                  val next = stages[nextIdx]
                  val gap = computeGap(next)
                  if (gap > 30_000) startWaiting(nextIdx, next) else startStage(nextIdx, 0L)
              }
              private fun finishAll() {
                  cancelStageAlarm(); running = false; paused = false; waiting = false
                  tickerJob?.cancel(); tickerJob = null
                  _state.value = TimerUiState(finished = true)
                  stopForeground(STOP_FOREGROUND_REMOVE); stopSelf()
              }
              private fun stopEverything() {
                  cancelStageAlarm(); running = false; paused = false; waiting = false
                  tickerJob?.cancel(); tickerJob = null; stopRingtone()
                  _state.value = TimerUiState(); stopForeground(STOP_FOREGROUND_REMOVE); stopSelf()
              }
              private fun setStageAlarm(triggerAt: Long) {
                  val am = getSystemService(AlarmManager::class.java) ?: return
                  val pi = PendingIntent.getBroadcast(this, 300, Intent(this, StageAlarmReceiver::class.java), PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                          if (am.canScheduleExactAlarms()) am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, triggerAt, pi)
                          else am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, triggerAt, pi)
                      } else am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, triggerAt, pi)
                  } catch (e: Exception) {}
              }
              private fun cancelStageAlarm() {
                  val am = getSystemService(AlarmManager::class.java) ?: return
                  val pi = PendingIntent.getBroadcast(this, 300, Intent(this, StageAlarmReceiver::class.java), PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                  try { am.cancel(pi) } catch (e: Exception) {}
              }
              private fun stopRingtone() {
                  try { mediaPlayer?.stop() } catch (e: Exception) {}
                  try { mediaPlayer?.release() } catch (e: Exception) {}
                  mediaPlayer = null
                  try { ringtone?.stop() } catch (e: Exception) {}
                  ringtone = null; ringStopJob?.cancel(); ringStopJob = null
                  try { wakeLock?.release() } catch (e: Exception) {}
                  wakeLock = null
                  _state.value = _state.value.copy(ringing = false)
                  NotificationManagerCompat.from(this).cancel(RING_ID)
              }
              private fun startTicker() {
                  if (tickerJob?.isActive == true) return
                  tickerJob = scope.launch {
                      while (isActive) {
                          if (running) {
                              when {
                                  waiting -> {
                                      val r = (nextStartAtMs - System.currentTimeMillis()).coerceAtLeast(0)
                                      if (r <= 0) { waiting = false; cancelStageAlarm(); startStage(pendingIndex, 0L) }
                                      else { emitState(r); maybeUpdateNotif() }
                                  }
                                  paused -> emitState(pausedRemaining)
                                  else -> {
                                      val r = (endTime - System.currentTimeMillis()).coerceAtLeast(0)
                                      if (r <= 0) stageFinished() else { emitState(r); maybeUpdateNotif() }
                                  }
                              }
                          }
                          delay(200)
                      }
                  }
              }
              private fun emitState(remaining: Long) {
                  val current = stages.getOrNull(index)
                  val next = if (waiting) stages.getOrNull(pendingIndex) else null
                  _state.value = _state.value.copy(
                      running = running, paused = paused || waiting, waiting = waiting,
                      stageName = current?.name ?: "", nextStageName = next?.name ?: "",
                      stageIndex = index, stageCount = stages.size, remainingMs = remaining,
                      stageDurationMs = (next ?: current)?.let { it.minutes * 60_000L } ?: 0L, loop = loop
                  )
              }
              private fun tasksForStage(key: String): List<Task> {
                  if (key.isBlank()) return emptyList()
                  return Store.loadTasks(this).filter { it.stageKey == key && !it.done }
              }

              private fun playAlarm() {
                  _state.value = _state.value.copy(ringing = true)
                  try { wakeLock?.release() } catch (e: Exception) {}
                  try {
                      val pm = getSystemService(PowerManager::class.java)
                      wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "LoopTimer::Alarm")
                      wakeLock?.acquire(180_000L)
                  } catch (e: Exception) {}

                  // 用 MediaPlayer 代替 Ringtone，兼容性更好
                  if (soundEnabled && ringtoneType != 2) {
                      try {
                          mediaPlayer?.release()
                          val type = if (ringtoneType == 1) RingtoneManager.TYPE_NOTIFICATION else RingtoneManager.TYPE_ALARM
                          var uri = RingtoneManager.getDefaultUri(type)
                          if (uri == null) uri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_ALARM)
                          if (uri == null) uri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION)
                          if (uri != null) {
                              val attrs = AudioAttributes.Builder()
                                  .setUsage(if (ringtoneType == 1) AudioAttributes.USAGE_NOTIFICATION else AudioAttributes.USAGE_ALARM)
                                  .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                                  .build()
                              mediaPlayer = MediaPlayer().apply {
                                  setAudioAttributes(attrs)
                                  setDataSource(applicationContext, uri)
                                  isLooping = true
                                  prepare()
                                  start()
                              }
                          }
                      } catch (e: Exception) {
                          // MediaPlayer 失败时 fallback 到 Ringtone
                          try {
                              ringtone?.stop()
                              val type = if (ringtoneType == 1) RingtoneManager.TYPE_NOTIFICATION else RingtoneManager.TYPE_ALARM
                              val uri = RingtoneManager.getDefaultUri(type) ?: RingtoneManager.getDefaultUri(RingtoneManager.TYPE_ALARM)
                              ringtone = RingtoneManager.getRingtone(applicationContext, uri)?.apply {
                                  audioAttributes = AudioAttributes.Builder()
                                      .setUsage(AudioAttributes.USAGE_ALARM).build()
                                  play()
                              }
                          } catch (t: Throwable) {}
                      }
                  }

                  if (vibrateEnabled) {
                      try {
                          val pattern = longArrayOf(0, 800, 400, 800, 400, 800)
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                              getSystemService(VibratorManager::class.java)?.defaultVibrator?.vibrate(VibrationEffect.createWaveform(pattern, -1))
                          } else {
                              @Suppress("DEPRECATION")
                              getSystemService(Vibrator::class.java)?.vibrate(VibrationEffect.createWaveform(pattern, -1))
                          }
                      } catch (e: Exception) {}
                  }

                  if (notificationEnabled) showRingNotification()

                  // 全屏锁屏提醒
                  try {
                      val ringIntent = Intent(this, RingActivity::class.java).apply {
                          flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP
                      }
                      val ringPi = PendingIntent.getActivity(this, 0, ringIntent,
                          PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                      ringPi.send()
                  } catch (e: Exception) {}

                  ringStopJob?.cancel()
                  if (ringDurationSec > 0) ringStopJob = scope.launch { delay(ringDurationSec * 1000L); stopRingtone() }
              }
              private fun showRingNotification() {
                  val current = stages.getOrNull(index)
                  val next = if (waiting) stages.getOrNull(pendingIndex) else stages.getOrNull(index + 1) ?: if (loop) stages.firstOrNull() else null
                  val stopPi = PendingIntent.getService(this, 202, Intent(this, TimerService::class.java).setAction(A_STOP_RING), PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                  val stageTasks = tasksForStage(current?.key() ?: "")
                  val taskText = if (stageTasks.isNotEmpty()) "\n本阶段待办：" + stageTasks.joinToString("；") { it.title } else ""
                  val n = NotificationCompat.Builder(this, RING_CH)
                      .setSmallIcon(android.R.drawable.ic_lock_idle_alarm)
                      .setContentTitle("⏰ ${current?.name ?: "阶段"} 结束")
                      .setContentText("下一阶段：${next?.name ?: "结束"}$taskText")
                      .setStyle(NotificationCompat.BigTextStyle().bigText("下一阶段：${next?.name ?: "结束"}$taskText"))
                      .setContentIntent(contentPi()).setFullScreenIntent(contentPi(), true)
                      .setVisibility(NotificationCompat.VISIBILITY_PUBLIC).setCategory(NotificationCompat.CATEGORY_ALARM)
                      .setAutoCancel(false).addAction(android.R.drawable.ic_media_pause, "关闭铃声", stopPi)
                      .setPriority(NotificationCompat.PRIORITY_MAX).setSilent(true).setOngoing(true).build()
                  NotificationManagerCompat.from(this).notify(RING_ID, n)
              }
              private fun createChannels() {
                  val mgr = getSystemService(NotificationManager::class.java)
                  if (mgr.getNotificationChannel(CH) == null) {
                      mgr.createNotificationChannel(NotificationChannel(CH, "计时通知", NotificationManager.IMPORTANCE_LOW).apply {
                          setSound(null, null); enableVibration(false)
                          lockscreenVisibility = Notification.VISIBILITY_PUBLIC
                      })
                  }
                  if (mgr.getNotificationChannel(RING_CH) == null) {
                      mgr.createNotificationChannel(NotificationChannel(RING_CH, "响铃提醒", NotificationManager.IMPORTANCE_HIGH).apply {
                          setSound(null, null); enableVibration(false)
                          lockscreenVisibility = Notification.VISIBILITY_PUBLIC
                      })
                  }
              }
              private fun startForegroundCompat() {
                  val n = buildOngoing()
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.UPSIDE_DOWN_CAKE) startForeground(ONGOING_ID, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE)
                  else startForeground(ONGOING_ID, n)
              }
              private fun notifyOngoing() { NotificationManagerCompat.from(this).notify(ONGOING_ID, buildOngoing()) }
              private fun maybeUpdateNotif() {
                  val now = System.currentTimeMillis()
                  if (now - lastNotif >= 900) { lastNotif = now; notifyOngoing() }
              }
              private fun contentPi(): PendingIntent {
                  return PendingIntent.getActivity(this, 0,
                      Intent(this, MainActivity::class.java).apply { flags = Intent.FLAG_ACTIVITY_SINGLE_TOP or Intent.FLAG_ACTIVITY_CLEAR_TOP },
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
              }
              private fun buildOngoing(): Notification {
                  val st = stages.getOrNull(index)
                  val r = when { waiting -> (nextStartAtMs - System.currentTimeMillis()).coerceAtLeast(0); paused -> pausedRemaining; else -> (endTime - System.currentTimeMillis()).coerceAtLeast(0) }
                  val title = when { waiting -> "等待下一阶段 · ${formatMs(r)}"; paused -> "已暂停 · ${st?.name ?: ""}"; st != null -> "${st.name} · ${formatMs(r)}"; else -> "计时" }
                  val stageTasks = tasksForStage(st?.key() ?: "")
                  val text = if (stageTasks.isNotEmpty()) "第 ${index + 1}/${stages.size} 段 · 待办：${stageTasks.joinToString("；") { it.title }}"
                             else "第 ${index + 1}/${stages.size} 段 · ${formatMs(r)}"
                  return NotificationCompat.Builder(this, CH)
                      .setSmallIcon(android.R.drawable.ic_lock_idle_alarm).setContentTitle(title).setContentText(text)
                      .setContentIntent(contentPi())
                      .setVisibility(NotificationCompat.VISIBILITY_PUBLIC)
                      .setOngoing(true).setOnlyAlertOnce(true).setSilent(true)
                      .setPriority(NotificationCompat.PRIORITY_LOW).setCategory(NotificationCompat.CATEGORY_STOPWATCH).build()
              }
          }
