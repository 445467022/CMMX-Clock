                                      enabled = !running && formStages.isNotEmpty()) { Text("清空", color = MaterialTheme.colorScheme.error) }
                              }
                          }
                          itemsIndexed(formStages, key = { i, _ -> "fs-$i" }) { i, st ->
                              FormStageRow(st, !running,
                                  onChange = { u -> formStages = formStages.toMutableList().also { it[i] = u }; Store.saveStages(ctx, formStages) },
                                  onDelete = { formStages = formStages.toMutableList().also { it.removeAt(i) }; Store.saveStages(ctx, formStages) })
                          }
                          item { GeneratePanel(formStages = formStages, loopStages = loopStages, running = running, onGenerate = { s, e, template ->
                              val gen = fillSchedule(s, e, template)
                              formStages = mergeStages(formStages, gen)
                              Store.saveStages(ctx, formStages)
                              Store.saveLastTemplate(ctx, gen)
                              if (scheduleEnabled) ScheduleReceiver.scheduleNext(ctx)
                          }) }
                          item {
                              Card(Modifier.fillMaxWidth()) {
                                  Column(Modifier.padding(10.dp)) {
                                      Row(verticalAlignment = Alignment.CenterVertically) {
                                          Text("每天自动执行（按表单首尾）", Modifier.weight(1f))
                                          Switch(scheduleEnabled, {
                                              scheduleEnabled = it; Store.saveScheduleEnabled(ctx, it)
                                              if (it) ScheduleReceiver.scheduleNext(ctx) else ScheduleReceiver.cancel(ctx)
                                          })
                                      }
                                      if (scheduleEnabled) {
                                          val timed = formStages.filter { it.startMin >= 0 }
                                          if (timed.isNotEmpty()) Text("每天 ${formatHm(timed.minOf { it.startMin })} → ${formatHm(timed.maxOf { it.startMin + it.minutes })}",
                                              style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.primary)
                                          else Text("表单中还没有带时间段的阶段", style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.onSurfaceVariant)
                                      }
                                  }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun TimerRing(ui: TimerUiState, previewMs: Long, title: String, subtitle: String) {
              val displayMs = if (ui.running) ui.remainingMs else previewMs
              val totalMs = if (ui.running) ui.stageDurationMs.coerceAtLeast(1) else previewMs
              val progress = if (totalMs > 0) (displayMs.toFloat() / totalMs).coerceIn(0f, 1f) else 0f
              Box(Modifier.size(200.dp), contentAlignment = Alignment.Center) {
                  CircularProgressIndicator(progress = { progress }, modifier = Modifier.fillMaxSize(), strokeWidth = 10.dp, strokeCap = StrokeCap.Round, trackColor = MaterialTheme.colorScheme.surfaceVariant)
                  Column(horizontalAlignment = Alignment.CenterHorizontally) {
                      Text(formatMs(displayMs), fontSize = 38.sp, fontFamily = FontFamily.Monospace, fontWeight = FontWeight.Bold)
                      Spacer(Modifier.height(4.dp))
                      Text(title, style = MaterialTheme.typography.titleMedium)
                      Text(subtitle, style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.onSurfaceVariant, textAlign = TextAlign.Center)
                  }
              }
          }

          fun fillSchedule(startMin: Int, endMin: Int, template: List<Stage>): List<Stage> {
              if (startMin >= endMin || template.isEmpty()) return emptyList()
              val out = mutableListOf<Stage>()
              var cur = startMin
              var i = 0
              while (cur < endMin) {
                  val tpl = template[i % template.size]
                  val dur = minOf(tpl.minutes, endMin - cur)
                  out += Stage(tpl.name, dur, cur)
                  cur += dur; i++
              }
              return out
          }

          fun mergeStages(old: List<Stage>, add: List<Stage>): List<Stage> {
              val result = mutableListOf<Stage>()
              val seen = mutableSetOf<Int>()
              old.forEach { if (it.startMin < 0 || seen.add(it.startMin)) result.add(it) }
              add.forEach { if (it.startMin < 0 || seen.add(it.startMin)) result.add(it) }
              return result.sortedWith(compareBy { if (it.startMin < 0) Int.MAX_VALUE else it.startMin })
          }

          fun dedupTemplate(list: List<Stage>): List<Stage> {
              val seen = mutableSetOf<String>()
              val out = mutableListOf<Stage>()
              list.forEach {
                  val key = "${it.name}|${it.minutes}"
                  if (seen.add(key) && it.minutes > 0) out.add(it)
              }
              return out
          }

