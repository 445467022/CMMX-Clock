              editing?.let { task ->
                  TaskDialog(
                      task = task,
                      stages = stages,
                      onDismiss = { editing = null },
                      onSave = { updated, remindAt ->
                          val newList = tasks.map { if (it.id == task.id) updated.copy(remindAt = remindAt) else it }
                          update(newList)
                          if (remindAt > 0) scheduleReminder(ctx, task.id.toInt(), updated.title, remindAt)
                          editing = null
                      }
                  )
              }
          }

          @Composable
          fun TaskDialog(task: Task, stages: List<Stage>, onDismiss: () -> Unit, onSave: (Task, Long) -> Unit) {
              var title by remember { mutableStateOf(task.title) }
              var note by remember { mutableStateOf(task.note) }
              var stageKey by remember { mutableStateOf(task.stageKey) }
              val initDate = if (task.remindAt > 0) {
                  java.time.Instant.ofEpochMilli(task.remindAt).atZone(ZoneId.systemDefault()).toLocalDate()
              } else LocalDate.now()
              val initTime = if (task.remindAt > 0) {
                  java.time.Instant.ofEpochMilli(task.remindAt).atZone(ZoneId.systemDefault()).toLocalTime()
              } else LocalTime.of(LocalTime.now().hour, 0)
              var dateText by remember { mutableStateOf(initDate.toString()) }
              var timeText by remember { mutableStateOf(initTime.format(DateTimeFormatter.ofPattern("HH:mm"))) }
              var error by remember { mutableStateOf("") }

              AlertDialog(
                  onDismissRequest = onDismiss,
                  title = { Text("编辑任务") },
                  text = {
                      Column(Modifier.verticalScroll(rememberScrollState())) {
                          OutlinedTextField(title, { title = it }, label = { Text("标题") }, singleLine = true, modifier = Modifier.fillMaxWidth())
                          Spacer(Modifier.height(6.dp))
                          OutlinedTextField(note, { note = it }, label = { Text("备注") }, singleLine = true, modifier = Modifier.fillMaxWidth())
                          Spacer(Modifier.height(8.dp))
                          Text("提醒时间（只输数字，自动补全）", style = MaterialTheme.typography.bodySmall)
                          OutlinedTextField(
                              dateText, { dateText = autoFormatDate(it) },
                              label = { Text("日期") }, singleLine = true,
                              modifier = Modifier.fillMaxWidth(),
                              keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number),
                              placeholder = { Text("20250115") }
                          )
                          Spacer(Modifier.height(4.dp))
                          OutlinedTextField(
                              timeText, { timeText = autoFormatTime(it) },
                              label = { Text("时间") }, singleLine = true,
                              modifier = Modifier.fillMaxWidth(),
                              keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number),
                              placeholder = { Text("0930") }
                          )
                          if (error.isNotBlank()) Text(error, color = MaterialTheme.colorScheme.error, style = MaterialTheme.typography.bodySmall)
                          Spacer(Modifier.height(10.dp))
                          Text("关联阶段（下拉选择，计时到该阶段时提醒）", style = MaterialTheme.typography.bodySmall)
                          if (stages.none { it.startMin >= 0 }) {
                              Text("请先在计时 Tab 生成带时间段的表单", style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.onSurfaceVariant)
                          } else {
                              StageDropdown(stages, stageKey) { stageKey = it }
                          }
                      }
                  },
                  confirmButton = {
                      TextButton({
                          val date = try { LocalDate.parse(dateText.trim()) } catch (e: Exception) { null }
                          val time = try { LocalTime.parse(timeText.trim()) } catch (e: Exception) { null }
                          if (date == null || time == null) {
                              error = "日期或时间格式错误"
                          } else {
                              val dt = LocalDateTime.of(date, time)
                              val ms = dt.atZone(ZoneId.systemDefault()).toInstant().toEpochMilli()
                              onSave(task.copy(title = title.trim(), note = note.trim(), stageKey = stageKey), ms)
                          }
                      }) { Text("保存") }
                  },
                  dismissButton = {
                      Row {
                          TextButton({
                              onSave(task.copy(title = title.trim(), stageKey = ""), 0L)
                          }) { Text("清除提醒") }
                          TextButton(onDismiss) { Text("取消") }
                      }
                  }
              )
          }

