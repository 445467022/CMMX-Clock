          fun headerText(mode: Int, anchor: LocalDate): String = when (mode) {
              0 -> anchor.format(DateTimeFormatter.ofPattern("yyyy年MM月dd日")) + " · " + Lunar.lunarText(anchor)
              1 -> {
                  val start = anchor.minusDays((anchor.dayOfWeek.value - 1).toLong())
                  val end = start.plusDays(6)
                  "${start.monthValue}/${start.dayOfMonth} - ${end.monthValue}/${end.dayOfMonth}"
              }
              else -> "${anchor.year}年${anchor.monthValue}月"
          }

          @Composable
          fun DayDetails(selected: LocalDate, tasks: List<Task>) {
              Card(Modifier.fillMaxWidth()) {
                  Column(Modifier.padding(16.dp)) {
                      Text(selected.format(DateTimeFormatter.ofPattern("yyyy年MM月dd日 EEEE")), style = MaterialTheme.typography.titleLarge)
                      Spacer(Modifier.height(4.dp))
                      Text("农历 " + Lunar.lunarText(selected), color = MaterialTheme.colorScheme.primary)
                      val h = Lunar.legalHoliday(selected)
                      val sp = Lunar.specialOf(selected)
                      if (h != null) Text("🎉 $h", color = MaterialTheme.colorScheme.error)
                      if (sp != null) Text("✨ $sp", color = MaterialTheme.colorScheme.tertiary)
                      val wd = selected.dayOfWeek.value
                      if (wd == 6 || wd == 7) Text("休息日", color = MaterialTheme.colorScheme.secondary)
                      else Text("工作日", color = MaterialTheme.colorScheme.onSurfaceVariant)
                  }
              }
              Spacer(Modifier.height(12.dp))
              Text("当日任务与日程", style = MaterialTheme.typography.titleMedium)
              val dayTasks = tasks.filter {
                  it.remindAt > 0 &&
                      java.time.Instant.ofEpochMilli(it.remindAt).atZone(ZoneId.systemDefault()).toLocalDate() == selected
              }
              if (dayTasks.isEmpty()) {
                  Text("暂无事件", color = MaterialTheme.colorScheme.onSurfaceVariant, modifier = Modifier.padding(vertical = 8.dp))
              } else {
                  dayTasks.forEach { e -> TaskEventRow(e) }
              }
          }

          @Composable
          fun TaskEventRow(e: Task) {
              val t = java.time.Instant.ofEpochMilli(e.remindAt).atZone(ZoneId.systemDefault()).toLocalTime()
              Card(Modifier.fillMaxWidth().padding(vertical = 4.dp)) {
                  Row(Modifier.padding(12.dp), verticalAlignment = Alignment.CenterVertically) {
                      Text(t.format(DateTimeFormatter.ofPattern("HH:mm")), Modifier.widthIn(min = 60.dp),
                          fontWeight = FontWeight.Bold, color = MaterialTheme.colorScheme.primary)
                      Text(e.title, modifier = Modifier.weight(1f),
                          textDecoration = if (e.done) TextDecoration.LineThrough else null)
                      if (e.stageKey.isNotBlank()) {
                          Text("🕒 " + e.stageKey, style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.tertiary)
                      }
                  }
              }
          }

          @Composable
          fun DayView(selected: LocalDate, tasks: List<Task>, onSelect: (LocalDate) -> Unit) {
              Column(Modifier.fillMaxSize().verticalScroll(rememberScrollState())) {
                  DayDetails(selected, tasks)
                  Spacer(Modifier.height(60.dp))
              }
          }

          @Composable
          fun WeekView(anchor: LocalDate, selected: LocalDate, tasks: List<Task>, onSelect: (LocalDate) -> Unit) {
              val weekStart = anchor.minusDays((anchor.dayOfWeek.value - 1).toLong())
              val weekEnd = weekStart.plusDays(6)
              Column(Modifier.fillMaxSize().verticalScroll(rememberScrollState())) {
                  Row(Modifier.fillMaxWidth()) {
                      for (i in 0..6) {
                          val d = weekStart.plusDays(i.toLong())
                          val isSel = d == selected
                          val bg = if (isSel) MaterialTheme.colorScheme.primary else MaterialTheme.colorScheme.surface
                          val fg = if (isSel) MaterialTheme.colorScheme.onPrimary else MaterialTheme.colorScheme.onSurface
                          Column(
                              Modifier.weight(1f).padding(2.dp).clip(RoundedCornerShape(8.dp))
                                  .background(bg).clickable { onSelect(d) }.padding(vertical = 8.dp),
                              horizontalAlignment = Alignment.CenterHorizontally
                          ) {
                              Text(dayOfWeekShort(d.dayOfWeek.value), fontSize = 11.sp, color = fg)
                              Text("${d.dayOfMonth}", fontSize = 18.sp, fontWeight = FontWeight.Bold, color = fg)
                              Text(Lunar.shortLabel(d), fontSize = 10.sp, color = fg, maxLines = 1)
                          }
                      }
                  }
                  Spacer(Modifier.height(12.dp))
                  DayDetails(selected, tasks)
                  Spacer(Modifier.height(12.dp))
                  Text("本周全部任务", style = MaterialTheme.typography.titleMedium)
                  val weekTasks = tasks.filter {
                      if (it.remindAt <= 0) return@filter false
                      val d = java.time.Instant.ofEpochMilli(it.remindAt).atZone(ZoneId.systemDefault()).toLocalDate()
                      !d.isBefore(weekStart) && !d.isAfter(weekEnd)
                  }.sortedBy { it.remindAt }
                  if (weekTasks.isEmpty()) {
                      Text("本周暂无任务", color = MaterialTheme.colorScheme.onSurfaceVariant, modifier = Modifier.padding(vertical = 8.dp))
                  } else {
                      weekTasks.forEach { e ->
                          Card(Modifier.fillMaxWidth().padding(vertical = 4.dp)) {
                              Row(Modifier.padding(12.dp), verticalAlignment = Alignment.CenterVertically) {
                                  val dt = java.time.Instant.ofEpochMilli(e.remindAt).atZone(ZoneId.systemDefault())
                                  Text(dt.format(DateTimeFormatter.ofPattern("MM-dd HH:mm")),
                                      Modifier.widthIn(min = 110.dp),
                                      fontWeight = FontWeight.Bold,
                                      color = MaterialTheme.colorScheme.primary)
                                  Text(e.title, modifier = Modifier.weight(1f),
                                      textDecoration = if (e.done) TextDecoration.LineThrough else null)
                              }
                          }
                      }
                  }
                  Spacer(Modifier.height(60.dp))
              }
          }

          @Composable
          fun MonthView(anchor: LocalDate, selected: LocalDate, tasks: List<Task>, onSelect: (LocalDate) -> Unit) {
              val ym = YearMonth.of(anchor.year, anchor.monthValue)
              val firstDay = ym.atDay(1)
              val startOffset = (firstDay.dayOfWeek.value + 6) % 7
              val daysInMonth = ym.lengthOfMonth()
              val rows = (startOffset + daysInMonth + 6) / 7

              Column(Modifier.fillMaxSize().verticalScroll(rememberScrollState())) {
                  Row(Modifier.fillMaxWidth()) {
                      listOf("一","二","三","四","五","六","日").forEach {
                          Text(it, Modifier.weight(1f), textAlign = TextAlign.Center,
                              fontSize = 12.sp, color = MaterialTheme.colorScheme.onSurfaceVariant, fontWeight = FontWeight.Bold)
                      }
                  }
                  for (r in 0 until rows) {
                      Row(Modifier.fillMaxWidth()) {
                          for (c in 0..6) {
                              val cellIdx = r * 7 + c
                              val dayNum = cellIdx - startOffset + 1
                              if (dayNum in 1..daysInMonth) {
                                  val d = ym.atDay(dayNum)
                                  val isSel = d == selected
                                  val isToday = d == LocalDate.now()
                                  val bg = when {
                                      isSel -> MaterialTheme.colorScheme.primary
                                      isToday -> MaterialTheme.colorScheme.primaryContainer
                                      else -> MaterialTheme.colorScheme.surface
                                  }
                                  val fg = when {
                                      isSel -> MaterialTheme.colorScheme.onPrimary
                                      else -> MaterialTheme.colorScheme.onSurface
                                  }
                                  val hasEvent = tasks.any {
                                      it.remindAt > 0 &&
                                          java.time.Instant.ofEpochMilli(it.remindAt).atZone(ZoneId.systemDefault()).toLocalDate() == d
                                  }
                                  Column(
                                      Modifier.weight(1f).aspectRatio(1f).padding(2.dp)
                                          .clip(RoundedCornerShape(6.dp)).background(bg)
                                          .clickable { onSelect(d) }.padding(2.dp),
                                      horizontalAlignment = Alignment.CenterHorizontally,
                                      verticalArrangement = Arrangement.Center
                                  ) {
                                      Text("$dayNum", fontSize = 15.sp, fontWeight = FontWeight.Bold, color = fg)
                                      Text(Lunar.shortLabel(d), fontSize = 9.sp, color = fg, maxLines = 1)
                                      if (hasEvent) Box(Modifier.size(4.dp).clip(CircleShape).background(MaterialTheme.colorScheme.error))
                                  }
                              } else {
                                  Spacer(Modifier.weight(1f).aspectRatio(1f).padding(2.dp))
                              }
                          }
                      }
                  }
                  Spacer(Modifier.height(12.dp))
                  DayDetails(selected, tasks)
                  Spacer(Modifier.height(12.dp))
                  Text("本月全部任务", style = MaterialTheme.typography.titleMedium)
                  val monthStart = ym.atDay(1)
                  val monthEnd = ym.atEndOfMonth()
                  val monthTasks = tasks.filter {
                      if (it.remindAt <= 0) return@filter false
                      val d = java.time.Instant.ofEpochMilli(it.remindAt).atZone(ZoneId.systemDefault()).toLocalDate()
                      !d.isBefore(monthStart) && !d.isAfter(monthEnd)
                  }.sortedBy { it.remindAt }
                  if (monthTasks.isEmpty()) {
                      Text("本月暂无任务", color = MaterialTheme.colorScheme.onSurfaceVariant, modifier = Modifier.padding(vertical = 8.dp))
                  } else {
                      monthTasks.forEach { e ->
                          Card(Modifier.fillMaxWidth().padding(vertical = 4.dp)) {
                              Row(Modifier.padding(12.dp), verticalAlignment = Alignment.CenterVertically) {
                                  val dt = java.time.Instant.ofEpochMilli(e.remindAt).atZone(ZoneId.systemDefault())
                                  Text(dt.format(DateTimeFormatter.ofPattern("MM-dd HH:mm")),
                                      Modifier.widthIn(min = 110.dp),
                                      fontWeight = FontWeight.Bold,
                                      color = MaterialTheme.colorScheme.primary)
                                  Text(e.title, modifier = Modifier.weight(1f),
                                      textDecoration = if (e.done) TextDecoration.LineThrough else null)
                              }
                          }
                      }
                  }
                  Spacer(Modifier.height(60.dp))
              }
          }

          fun dayOfWeekShort(d: Int): String = when (d) { 1->"一";2->"二";3->"三";4->"四";5->"五";6->"六";else->"日" }

          @Composable
          fun AddEventDialog(initialDate: LocalDate, onDismiss: () -> Unit, onConfirm: (String, Long) -> Unit) {
              var title by remember { mutableStateOf("") }
              var dateText by remember { mutableStateOf(initialDate.toString()) }
              var timeText by remember { mutableStateOf("0900") }
              var error by remember { mutableStateOf("") }
              AlertDialog(
                  onDismissRequest = onDismiss,
                  title = { Text("添加日程") },
                  text = {
                      Column {
                          OutlinedTextField(title, { title = it }, label = { Text("标题") }, singleLine = true, modifier = Modifier.fillMaxWidth())
                          Spacer(Modifier.height(6.dp))
                          Text("只输数字，符号自动补全", style = MaterialTheme.typography.bodySmall)
                          OutlinedTextField(
                              dateText, { dateText = autoFormatDate(it) },
                              label = { Text("日期") }, singleLine = true,
                              modifier = Modifier.fillMaxWidth(),
                              keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number),
                              placeholder = { Text("20250115") }
                          )
                          Spacer(Modifier.height(4.dp))
                          OutlinedTextField(
                              timeText, { timeText = autoFormatTime(it) },
                              label = { Text("时间") }, singleLine = true,
                              modifier = Modifier.fillMaxWidth(),
                              keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number),
                              placeholder = { Text("0930") }
                          )
                          if (error.isNotBlank()) Text(error, color = MaterialTheme.colorScheme.error, style = MaterialTheme.typography.bodySmall)
                      }
                  },
                  confirmButton = {
                      TextButton({
                          if (title.isBlank()) { error = "请填写标题"; return@TextButton }
                          val date = try { LocalDate.parse(dateText.trim()) } catch (e: Exception) { null }
                          val time = try { LocalTime.parse(timeText.trim()) } catch (e: Exception) { null }
                          if (date == null || time == null) { error = "日期或时间格式错误"; return@TextButton }
                          val dt = LocalDateTime.of(date, time)
                          onConfirm(title.trim(), dt.atZone(ZoneId.systemDefault()).toInstant().toEpochMilli())
                      }) { Text("保存") }
                  },
                  dismissButton = { TextButton(onDismiss) { Text("取消") } }
              )
          }
          MA_EOF

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk LoopTimer.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LoopTimer-apk
          path: LoopTimer.apk
