                              Icon(Icons.Default.Delete, contentDescription = "删", modifier = Modifier.size(16.dp))
                          }
                      }
                      Spacer(Modifier.height(4.dp))
                      // 时间段 + 共 X 分钟
                      Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(2.dp)) {
                          val startStr = if (stage.startMin >= 0) formatHm(stage.startMin) else "00:00"
                          val endStr = if (stage.startMin >= 0) formatHm(stage.startMin + stage.minutes) else "00:00"
                          FixedTimeField(startStr, { v ->
                              parseHm(v)?.let { onChange(stage.copy(startMin = it)) }
                          }, enabled, smallStyle)
                          Text("→", fontSize = 12.sp, color = MaterialTheme.colorScheme.primary, fontWeight = FontWeight.Bold)
                          FixedTimeField(endStr, { v ->
                              val end = parseHm(v)
                              if (end != null && stage.startMin >= 0) {
                                  val newMin = ((end - stage.startMin) % 1440 + 1440) % 1440
                                  if (newMin > 0) onChange(stage.copy(minutes = newMin))
                              }
                          }, enabled, smallStyle)
                          Spacer(Modifier.weight(1f))
                          Text("共 ${stage.minutes}分", fontSize = 12.sp, color = MaterialTheme.colorScheme.primary)
                      }
