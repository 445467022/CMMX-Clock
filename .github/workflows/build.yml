          @Composable
          fun FormStageRow(stage: Stage, enabled: Boolean, onChange: (Stage) -> Unit, onDelete: () -> Unit) {
              val smallStyle = TextStyle(fontSize = 12.sp, color = MaterialTheme.colorScheme.onSurface)
              Card(Modifier.fillMaxWidth()) {
                  Column(Modifier.padding(8.dp)) {
                      // 名称行
                      Row(verticalAlignment = Alignment.CenterVertically) {
                          CompactTextField(stage.name, { onChange(stage.copy(name = it)) },
                              Modifier.weight(1f), enabled, "名称", KeyboardType.Text, smallStyle)
