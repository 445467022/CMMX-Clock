          import android.media.RingtoneManager
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.os.VibratorManager
          import androidx.core.app.NotificationCompat
          import androidx.core.app.NotificationManagerCompat
          import androidx.core.content.ContextCompat

          class ReminderReceiver : BroadcastReceiver() {
              override fun onReceive(ctx: Context, intent: Intent) {
                  val id = intent.getIntExtra("id", 1)
                  val title = intent.getStringExtra("title") ?: "提醒"

                  val task = Store.loadTasks(ctx).find { it.id == id.toLong() }
                  val soundEnabled = task?.remindSound ?: Store.loadSound(ctx)
                  val vibrateEnabled = task?.remindVibrate ?: Store.loadVibrate(ctx)
                  val notificationEnabled = task?.remindNotification ?: Store.loadNotification(ctx)
                  val ringtoneType = task?.remindRingtoneType ?: Store.loadRingtoneType(ctx)
                  val ringDuration = task?.remindRingDuration ?: Store.loadRingDuration(ctx)

                  val channel = "reminder_channel_v2"
                  val mgr = ctx.getSystemService(NotificationManager::class.java)
                  if (mgr.getNotificationChannel(channel) == null) {
                      mgr.createNotificationChannel(NotificationChannel(channel, "待办提醒", NotificationManager.IMPORTANCE_HIGH).apply {
                          setSound(null, null)
                          lockscreenVisibility = android.app.Notification.VISIBILITY_PUBLIC
                      })
                  }
                  val pi = PendingIntent.getActivity(ctx, id,
                      Intent(ctx, MainActivity::class.java).apply { flags = Intent.FLAG_ACTIVITY_SINGLE_TOP },
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                  if (notificationEnabled) {
                      val n = NotificationCompat.Builder(ctx, channel)
                          .setSmallIcon(android.R.drawable.ic_lock_idle_alarm)
                          .setContentTitle("⏰ $title").setContentText("时间到了！")
                          .setContentIntent(pi).setAutoCancel(true)
                          .setVisibility(NotificationCompat.VISIBILITY_PUBLIC)
                          .setPriority(NotificationCompat.PRIORITY_HIGH).setSilent(true).build()
                      if (Build.VERSION.SDK_INT < Build.VERSION_CODES.TIRAMISU ||
                          ContextCompat.checkSelfPermission(ctx, Manifest.permission.POST_NOTIFICATIONS) == PackageManager.PERMISSION_GRANTED) {
                          NotificationManagerCompat.from(ctx).notify(id, n)
                      }
                  }

                  if (soundEnabled && ringtoneType != 2) {
                      try {
                          val type = if (ringtoneType == 1) RingtoneManager.TYPE_NOTIFICATION else RingtoneManager.TYPE_ALARM
                          val uri = RingtoneManager.getDefaultUri(type)
                              ?: RingtoneManager.getDefaultUri(RingtoneManager.TYPE_ALARM)
                              ?: RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION)
                          if (uri != null) {
                              val mp = MediaPlayer().apply {
                                  setAudioAttributes(AudioAttributes.Builder()
                                      .setUsage(if (ringtoneType == 1) AudioAttributes.USAGE_NOTIFICATION else AudioAttributes.USAGE_ALARM)
                                      .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION).build())
                                  setDataSource(ctx, uri)
                                  isLooping = false
                                  prepare()
                                  start()
                              }
                              val pendingResult = goAsync()
                              val dur = if (ringDuration <= 0) 30 else ringDuration.coerceAtMost(30)
                              Handler(Looper.getMainLooper()).postDelayed({
                                  try { mp.stop(); mp.release() } catch (e: Exception) {}
                                  pendingResult.finish()
                              }, dur * 1000L)
                          }
                      } catch (e: Exception) {}
                  }

                  if (vibrateEnabled) {
                      try {
                          val pattern = longArrayOf(0, 800, 400, 800, 400, 800)
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                              ctx.getSystemService(VibratorManager::class.java)?.defaultVibrator?.vibrate(VibrationEffect.createWaveform(pattern, -1))
                          } else {
                              @Suppress("DEPRECATION")
                              ctx.getSystemService(Vibrator::class.java)?.vibrate(VibrationEffect.createWaveform(pattern, -1))
                          }
                      } catch (e: Exception) {}
                  }
              }
          }
