          @Composable
          fun GeneratePanel(formStages: List<Stage>, loopStages: List<Stage>, running: Boolean,
                            onGenerate: (start: Int, end: Int, template: List<Stage>) -> Unit) {
              val ctx = LocalContext.current
              var source by remember { mutableIntStateOf(0) }
              var startText by remember { mutableStateOf("") }
              var endText by remember { mutableStateOf("") }
              var customTemplates by remember { mutableStateOf(listOf(Stage("工作", 30), Stage("休息", 5))) }

              // 用 remember 确保状态更新后重新计算
              val lastSaved = remember(formStages, source) { if (source == 1) Store.loadLastTemplate(ctx) else emptyList() }
              val template: List<Stage> = remember(source, loopStages, formStages, customTemplates, lastSaved) {
                  when (source) {
                      0 -> if (loopStages.isEmpty()) listOf(Stage("工作", 30), Stage("休息", 5)) else loopStages
                      1 -> when {
                          lastSaved.isNotEmpty() -> lastSaved
                          formStages.isNotEmpty() -> dedupTemplate(formStages.map { Stage(it.name, it.minutes) })
                          else -> emptyList()
                      }
                      else -> customTemplates
                  }
              }

              Card(Modifier.fillMaxWidth()) {
                  Column(Modifier.padding(10.dp)) {
                      Text("生成时间段表单（可多次追加）", style = MaterialTheme.typography.titleSmall)
                      Spacer(Modifier.height(4.dp))
                      Text("阶段模板来源", style = MaterialTheme.typography.bodySmall)
                      Row(horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                          FilterChip(source == 0, { source = 0 }, label = { Text("循环模式") }, enabled = !running)
                          FilterChip(source == 1, { source = 1 }, label = { Text("上次表单") }, enabled = !running)
                          FilterChip(source == 2, { source = 2 }, label = { Text("自定义") }, enabled = !running)
                      }
                      Spacer(Modifier.height(6.dp))
                      Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {
                          Text("开始", Modifier.width(40.dp), style = MaterialTheme.typography.bodyMedium)
                          Box(Modifier.weight(1f), contentAlignment = Alignment.Center) { FixedTimeField(startText, { startText = it }, !running) }
                          Spacer(Modifier.width(40.dp))
                      }
                      Spacer(Modifier.height(4.dp))
                      Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {
                          Text("结束", Modifier.width(40.dp), style = MaterialTheme.typography.bodyMedium)
                          Box(Modifier.weight(1f), contentAlignment = Alignment.Center) { FixedTimeField(endText, { endText = it }, !running) }
                          Spacer(Modifier.width(40.dp))
                      }
                      Spacer(Modifier.height(6.dp))
                      when (source) {
                          0 -> if (template.isEmpty()) {
                              Text("循环模式无阶段", style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.onSurfaceVariant)
                          } else {
                              Text("模板：${template.joinToString(" → ") { "${it.name}${it.minutes}分" }}",
                                  style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.primary)
                          }
                          1 -> if (template.isEmpty()) {
                              Text("还没有可用模板（生成一次后会自动记住）", style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.onSurfaceVariant)
                          } else {
                              Text("模板：${template.joinToString(" → ") { "${it.name}${it.minutes}分" }}",
                                  style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.primary)
                          }
                          else -> {
                              Text("自定义阶段模板", style = MaterialTheme.typography.bodySmall)
                              customTemplates.forEachIndexed { i, st ->
                                  Card(Modifier.fillMaxWidth().padding(vertical = 2.dp)) {
                                      Column(Modifier.padding(6.dp)) {
                                          Row(verticalAlignment = Alignment.CenterVertically) {
                                              CompactTextField(st.name, { v ->
                                                  customTemplates = customTemplates.toMutableList().also { list -> list[i] = st.copy(name = v) }
                                              }, Modifier.weight(1f), !running, "名称")
                                              IconButton({
                                                  if (customTemplates.size > 1) customTemplates = customTemplates.toMutableList().also { it.removeAt(i) }
                                              }, enabled = !running, modifier = Modifier.size(28.dp)) {
                                                  Icon(Icons.Default.Delete, contentDescription = "删", modifier = Modifier.size(16.dp))
                                              }
                                          }
                                          Spacer(Modifier.height(4.dp))
                                          DurationInput(st.minutes, !running, { newMin ->
                                              customTemplates = customTemplates.toMutableList().also { list -> list[i] = st.copy(minutes = newMin) }
                                          })
                                      }
                                  }
                              }
                              TextButton({ customTemplates = customTemplates + Stage("阶段${customTemplates.size + 1}", 10) },
                                  enabled = !running && customTemplates.size < 10) { Text("+ 添加阶段") }
                          }
                      }
                      Spacer(Modifier.height(6.dp))
                      Button(
                          onClick = {
                              val s = parseHm(startText); val e = parseHm(endText)
                              if (s != null && e != null && s < e && template.isNotEmpty()) {
                                  onGenerate(s, e, template)
                                  startText = ""; endText = ""
                              }
                          },
                          enabled = !running && parseHm(startText) != null && parseHm(endText) != null && template.isNotEmpty(),
                          modifier = Modifier.fillMaxWidth()
                      ) { Text("追加生成") }
                  }
              }
          }

          @Composable
          fun TodoTab() {
              val ctx = LocalContext.current
              var tasks by remember { mutableStateOf(Store.loadTasks(ctx)) }
              var editing by remember { mutableStateOf<Task?>(null) }
              val formStages = remember { Store.loadStages(ctx) }
              val loopStages = remember { Store.loadLoopStages(ctx) }
              val allStages = (formStages + loopStages).filter { it.name.isNotBlank() }

              fun update(l: List<Task>) { tasks = l; Store.saveTasks(ctx, l) }

              Column(Modifier.fillMaxSize().padding(12.dp)) {
                  Row(verticalAlignment = Alignment.CenterVertically) {
                      Text("待办 (${tasks.size})", Modifier.weight(1f), style = MaterialTheme.typography.titleMedium)
                      Button({ editing = Task(0L, "") }) { Text("+ 添加待办") }
                  }
                  Spacer(Modifier.height(8.dp))
                  if (tasks.isEmpty()) {
                      Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                          Text("暂无待办，点右上角添加", color = MaterialTheme.colorScheme.onSurfaceVariant)
                      }
                  } else {
                      LazyColumn(Modifier.weight(1f), verticalArrangement = Arrangement.spacedBy(6.dp)) {
                          items(tasks, key = { it.id }) { task ->
                              Row(Modifier.fillMaxWidth().clip(RoundedCornerShape(8.dp))
                                  .background(MaterialTheme.colorScheme.surfaceVariant.copy(alpha = 0.4f)).padding(8.dp),
                                  verticalAlignment = Alignment.CenterVertically) {
                                  Checkbox(task.done, { c -> update(tasks.map { if (it.id == task.id) it.copy(done = c) else it }) })
                                  Column(Modifier.weight(1f).clickable { editing = task }) {
                                      Text(task.title, textDecoration = if (task.done) TextDecoration.LineThrough else null,
                                          color = if (task.done) MaterialTheme.colorScheme.onSurfaceVariant else MaterialTheme.colorScheme.onSurface)
                                      if (task.remindAt > 0) {
                                          val dt = java.time.Instant.ofEpochMilli(task.remindAt).atZone(ZoneId.systemDefault()).toLocalDateTime()
                                          Text("⏰ " + dt.format(DateTimeFormatter.ofPattern("MM-dd HH:mm")),
                                              style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.primary)
                                      }
                                      if (task.stageKey.isNotBlank()) Text("🕒 " + task.stageKey, style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.tertiary)
                                      if (task.note.isNotBlank()) Text(task.note, style = MaterialTheme.typography.bodySmall, maxLines = 2)
                                  }
                                  IconButton({ editing = task }) {
                                      Icon(Icons.Default.Notifications, contentDescription = "编辑",
                                          tint = if (task.remindAt > 0 || task.stageKey.isNotBlank()) MaterialTheme.colorScheme.primary else MaterialTheme.colorScheme.onSurfaceVariant)
                                  }
                                  IconButton({ update(tasks.filterNot { it.id == task.id }) }) { Icon(Icons.Default.Close, contentDescription = "删") }
                              }
                          }
                      }
                  }
              }

              editing?.let { task ->
                  TaskDialog(task, allStages, onDismiss = { editing = null }) { updated, remindAt ->
                      val isNew = tasks.none { it.id == updated.id } || updated.id == 0L
                      val id = if (updated.id == 0L) System.currentTimeMillis() else updated.id
                      val finalTask = updated.copy(id = id, remindAt = remindAt)
                      val newList = if (isNew) tasks + finalTask else tasks.map { if (it.id == task.id) finalTask else it }
                      update(newList)
                      if (remindAt > 0) scheduleReminder(ctx, id.toInt(), finalTask.title, remindAt)
                      editing = null
                  }
              }
          }

