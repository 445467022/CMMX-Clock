          fun generateSchedule(startMin: Int, endMin: Int, workMin: Int, restMin: Int): List<Stage> {
              if (startMin >= endMin || workMin < 1 || restMin < 1) return emptyList()
              val out = mutableListOf<Stage>()
              var cur = startMin
              while (cur < endMin) {
                  val we = minOf(cur + workMin, endMin)
                  out += Stage("工作", we - cur, cur)
                  cur = we
                  if (cur >= endMin) break
                  val re = minOf(cur + restMin, endMin)
                  out += Stage("休息", re - cur, cur)
                  cur = re
              }
              return out
          }

