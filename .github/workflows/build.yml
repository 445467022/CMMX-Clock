          package com.example.looptimer

          import android.app.AlarmManager
          import android.app.PendingIntent
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.os.Build
          import java.util.Calendar

          class ScheduleReceiver : BroadcastReceiver() {
              companion object {
                  const val ACTION_DAILY_START = "looptimer.action.DAILY_START"
                  const val ACTION_DAILY_STOP = "looptimer.action.DAILY_STOP"
                  fun scheduleNext(ctx: Context) {
                      val timed = Store.loadStages(ctx).filter { it.startMin >= 0 }
                      if (timed.isEmpty()) return
                      setAlarmAt(ctx, timed.minOf { it.startMin }, ACTION_DAILY_START, 100)
                      setAlarmAt(ctx, timed.maxOf { it.startMin + it.minutes }, ACTION_DAILY_STOP, 101)
                  }
                  fun cancel(ctx: Context) {
                      val am = ctx.getSystemService(AlarmManager::class.java) ?: return
                      listOf(100 to ACTION_DAILY_START, 101 to ACTION_DAILY_STOP).forEach { (id, action) ->
                          am.cancel(PendingIntent.getBroadcast(ctx, id, Intent(ctx, ScheduleReceiver::class.java).setAction(action),
                              PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE))
                      }
                  }
                  private fun setAlarmAt(ctx: Context, minuteOfDay: Int, action: String, reqCode: Int) {
                      val cal = Calendar.getInstance().apply {
                          set(Calendar.HOUR_OF_DAY, minuteOfDay / 60); set(Calendar.MINUTE, minuteOfDay % 60)
                          set(Calendar.SECOND, 0); set(Calendar.MILLISECOND, 0)
                          if (timeInMillis <= System.currentTimeMillis() + 5_000) add(Calendar.DAY_OF_YEAR, 1)
                      }
                      val am = ctx.getSystemService(AlarmManager::class.java) ?: return
                      val pi = PendingIntent.getBroadcast(ctx, reqCode, Intent(ctx, ScheduleReceiver::class.java).setAction(action),
                          PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                      try {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                              if (am.canScheduleExactAlarms()) am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, cal.timeInMillis, pi)
                              else am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, cal.timeInMillis, pi)
                          } else am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, cal.timeInMillis, pi)
                      } catch (e: Exception) {}
                  }
              }
              override fun onReceive(ctx: Context, intent: Intent) {
                  when (intent.action) {
                      ACTION_DAILY_START -> {
                          if (Store.loadScheduleEnabled(ctx)) {
                              val stages = Store.loadStages(ctx)
                              if (stages.isNotEmpty()) TimerService.start(ctx, stages, false)
                          }
                          scheduleNext(ctx)
                      }
                      ACTION_DAILY_STOP -> { TimerService.stop(ctx); scheduleNext(ctx) }
                      Intent.ACTION_BOOT_COMPLETED -> if (Store.loadScheduleEnabled(ctx)) scheduleNext(ctx)
                  }
              }
          }
