          fun scheduleReminder(ctx: Context, id: Int, title: String, timeMs: Long) {
              if (timeMs <= System.currentTimeMillis()) return
              try {
                  val am = ctx.getSystemService(AlarmManager::class.java) ?: return
                  val intent = Intent(ctx, ReminderReceiver::class.java).apply {
                      putExtra("id", id); putExtra("title", title)
                  }
                  val pi = PendingIntent.getBroadcast(ctx, id, intent, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                      if (am.canScheduleExactAlarms()) am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, timeMs, pi)
                      else am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, timeMs, pi)
                  } else {
                      am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, timeMs, pi)
                  }
              } catch (e: Exception) {}
          }

